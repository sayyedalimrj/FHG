name: FHG private ONE APK Hiddify-core plus GeckoView
on:
  push:
    branches:
      - android-unified-hiddify-source-20261107
    paths:
      - 'tools/unified_hiddify_overlay.py'
      - '.github/workflows/fhg-unified-one-apk-ci.yml'
      - '.github/scripts/fhg-unified-one-apk-smoke.sh'
      - 'android/app/src/main/java/com/fhg/android/**'
  workflow_dispatch:

permissions:
  contents: read

# Prevent multiple expensive rebuilds when rapid fixes land on this branch.
concurrency:
  group: fhg-unified-one-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - name: Clean build machine
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2.21.0
        with:
          flutter-version: '3.44.4'
          channel: stable
          cache: true
      - name: Provision Android SDK and protobuf
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" "platforms;android-37.0" "build-tools;36.0.0" "ndk;28.2.13676358"
          sudo apt-get update -qq
          sudo apt-get install -y protobuf-compiler
      - name: Acquire pinned official Hiddify source
        run: |
          set -euo pipefail
          git clone --depth 1 --branch v5.5.5 https://github.com/hiddify/hiddify-app.git upstream
          grep -q '^version: 5.5.5' upstream/pubspec.yaml
          grep -q 'Hiddify Extended GNU General Public License' upstream/LICENSE.md
          git -C upstream rev-parse HEAD > upstream-commit.txt
      - name: Integrate FHG into same application package
        run: |
          set -euo pipefail
          python3 tools/unified_hiddify_overlay.py . upstream
          grep -q 'applicationId "com.fhg.android.unified"' upstream/android/app/build.gradle
          test "$(grep -c 'android.intent.category.LAUNCHER' upstream/android/app/src/main/AndroidManifest.xml)" -eq 1
          grep -q 'android:name=".bg.VPNService"' upstream/android/app/src/main/AndroidManifest.xml
      - name: Download exact official Hiddify native VPN core
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p upstream/android/app/libs
          # Some runners receive 504 from GitHub's release-asset CDN.
          # GH CLI uses the API asset endpoint as a fallback, with exact hash.
          if ! curl -fL --retry 3 --retry-delay 5 --max-time 240 \
            "https://github.com/hiddify/hiddify-core/releases/download/v5.5.5/hiddify-lib-android.tar.gz" \
            -o /tmp/fhg-core.tar.gz; then
            echo 'Direct CDN failed; downloading the identical official asset through GitHub API'
            rm -f /tmp/fhg-core.tar.gz
            gh release download v5.5.5 -R hiddify/hiddify-core \
              -p 'hiddify-lib-android.tar.gz' -D /tmp --clobber
            # gh preserves the ORIGINAL asset filename; normalise before
            # verifying the unchanged pinned sha256.
            test -s /tmp/hiddify-lib-android.tar.gz
            mv /tmp/hiddify-lib-android.tar.gz /tmp/fhg-core.tar.gz
          fi
          echo 'd428adaf1ebe94046cdf3e32354f5ef84f9c3019432205ccf2a84f10a5a03dd0  /tmp/fhg-core.tar.gz' | sha256sum -c -
          tar -xzf /tmp/fhg-core.tar.gz -C upstream/android/app/libs
          find upstream/android/app/libs -type f | head -30
      - name: Generate Flutter code
        working-directory: upstream
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs
          dart run slang
      - name: Align Kotlin compiler and Sentry with resolved 2.4 stdlib
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob, pathlib
          # Kotlin 2.2 cannot parse kotlin-stdlib 2.4.20 metadata (2.4.0).
          # Kotlin 2.4.21 is compatible with AGP 9.1.1 and Gradle 9.3.1.
          settings=pathlib.Path('upstream/android/settings.gradle')
          original=settings.read_text(encoding='utf-8')
          before='version "2.2.10" apply false'
          assert original.count(before)==1, 'Unexpected upstream Kotlin plugin version'
          settings.write_text(original.replace(before,'version "2.4.21" apply false',1),encoding='utf-8')
          print('FHG: Kotlin compiler set to 2.4.21 to match kotlin-stdlib metadata 2.4')
          files=glob.glob(str(pathlib.Path.home()/'.pub-cache/hosted/pub.dev/sentry_flutter-8.*/android/build.gradle'))
          if len(files)!=1:
              raise SystemExit(f'Expected exactly one Sentry 8.x Android Gradle script, got: {files!r}')
          p=pathlib.Path(files[0]); body=p.read_text(encoding='utf-8')
          matches=0
          for old in ('languageVersion = "1.6"', "languageVersion = '1.6'"):
              matches+=body.count(old)
              body=body.replace(old,old.replace('1.6','2.0'))
          if matches>1:
              raise SystemExit(f'Ambiguous Sentry Kotlin languageVersion anchors in {p}: {matches}')
          if matches==1:
              p.write_text(body,encoding='utf-8')
              print(f'FHG: upgraded Sentry Kotlin language level to 2.0 for compiler 2.4: {p}')
          else:
              # Newer Sentry 8.x no longer declares the legacy 1.6 target.
              # Do not fail solely because the obsolete patch is unnecessary.
              print(f'FHG: Sentry no longer has a legacy 1.6 languageVersion override: {p}')
          # Old Flutter plugins use fixed compileSdk 31/33/34 even though
          # current AndroidX requires 36+. Raise compile-only SDK, NOT
          # minSdk, targetSdk, plugin runtime behavior, or app permissions.
          import re
          scripts=sorted(pathlib.Path.home().glob('.pub-cache/hosted/pub.dev/*/android/build.gradle*'))
          patched_names=set()
          for plugin_script in scripts:
              if not plugin_script.is_file():
                  continue
              old_text=plugin_script.read_text(encoding='utf-8')
              pattern=r'(?m)^(\s*compileSdk(?:Version)?\s*(?:=\s*)?)(\d+)\b'
              def sdk_repl(match):
                  return match.group(1)+'37' if int(match.group(2))<37 else match.group(0)
              new_text=re.sub(pattern,sdk_repl,old_text)
              if new_text!=old_text:
                  plugin_script.write_text(new_text,encoding='utf-8')
                  patched_names.add(plugin_script.parent.parent.name)
          # Plugin minor versions can advance; absence of a fixed OLD version
          # may mean it now declares a suitable compileSdk itself. Let AGP
          # validate dependency requirements instead of failing on names.
          if not patched_names:
              print('FHG: no legacy fixed compileSdk declarations need rewriting')
          else:
              print('FHG: aligned old Flutter plugin compileSdk levels to API 37: '+
                    ', '.join(sorted(patched_names)))
          PY
      - name: Configure Maven Central mirror fallbacks for Kotlin 504
        shell: bash
        run: |
          set -euo pipefail
          # This init script applies to the Flutter included Gradle build too.
          # Mirror only JetBrains Kotlin artifacts; don't change versions.
          mkdir -p "$HOME/.gradle/init.d"
          cat > "$HOME/.gradle/init.d/00-fhg-kotlin-mirrors.gradle" <<'GRADLE'
          def kotlinMirrors = [
            'https://maven-central.storage-download.googleapis.com/maven2/',
            'https://maven-central-eu.storage-download.googleapis.com/maven2/',
            'https://maven.aliyun.com/repository/central/'
          ]
          def addKotlinMirror = { repos, uriString, n ->
            repos.maven {
              name = 'FHGKotlinMirror' + n
              url = uri(uriString)
              content { includeGroup('org.jetbrains.kotlin') }
            }
          }
          gradle.beforeSettings { settings ->
            kotlinMirrors.eachWithIndex { url, n ->
              addKotlinMirror(settings.pluginManagement.repositories, url, n)
            }
          }
          gradle.beforeProject { project ->
            kotlinMirrors.eachWithIndex { url, n ->
              addKotlinMirror(project.repositories, url, n)
              addKotlinMirror(project.buildscript.repositories, url, n)
            }
          }
          GRADLE
          # Reachability probes only fetch the small POM, not a huge binary.
          POM=org/jetbrains/kotlin/kotlin-compiler-embeddable/2.2.21/kotlin-compiler-embeddable-2.2.21.pom
          ok=0
          for host in "https://maven-central.storage-download.googleapis.com/maven2" "https://maven-central-eu.storage-download.googleapis.com/maven2" "https://maven.aliyun.com/repository/central"; do
            if curl -fsSL --retry 1 --connect-timeout 6 --max-time 16 "$host/$POM" -o /tmp/fhg-kotlin-2.2.21.pom; then
              grep -q '<artifactId>kotlin-compiler-embeddable</artifactId>' /tmp/fhg-kotlin-2.2.21.pom
              echo "Kotlin mirror reachable: $host"
              ok=1
              break
            fi
          done
          if [ "$ok" -eq 0 ]; then
            echo "Kotlin mirrors unavailable from runner; Gradle will still try existing repositories" >&2
          fi
      - name: Compile full unified Hiddify+FHG Android APK
        working-directory: upstream
        shell: bash
        run: |
          set -euo pipefail
          flutter build apk --release --target lib/main_prod.dart \
            --target-platform android-arm64,android-x64 \
            --split-per-abi --no-shrink
          ls -lah build/app/outputs/flutter-apk
      - name: Verify one Android package and no missing components
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp upstream/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk dist/FHG-Hiddify-UNIFIED-arm64.apk
          cp upstream/build/app/outputs/flutter-apk/app-x86_64-release.apk dist/FHG-Hiddify-UNIFIED-x64-TEST.apk
          APK=dist/FHG-Hiddify-UNIFIED-arm64.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" > dist/BUILD-INFO.txt
          grep -q "package: name='com.fhg.android.unified'" dist/BUILD-INFO.txt
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump xmltree "$APK" AndroidManifest.xml > /tmp/unified-manifest.txt
          grep -q 'com.fhg.android.MainActivity' /tmp/unified-manifest.txt
          grep -q 'com.fhg.android.BrowserActivity' /tmp/unified-manifest.txt
          grep -q 'VPNService' /tmp/unified-manifest.txt
          unzip -l "$APK" | grep -E 'lib/arm64-v8a/.*so'
          sha256sum dist/*.apk > dist/SHA256SUMS.txt
          cp upstream-commit.txt dist/
          cp upstream/FHG_SOURCE_MODIFICATIONS.md dist/
          cp upstream/LICENSE.md dist/UPSTREAM-LICENSE.md
          echo 'PERSONAL TEST: do not redistribute without complying with original Hiddify fork and GPL obligations.' > dist/IMPORTANT.txt
      - uses: actions/upload-artifact@v4
        with:
          name: FHG-HIDDIFY-ONE-APK-PERSONAL-TEST
          path: dist/
          retention-days: 14
          if-no-files-found: error

  install:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: FHG-HIDDIFY-ONE-APK-PERSONAL-TEST
          path: dist
      - name: Verify artifact
        run: sha256sum -c dist/SHA256SUMS.txt
      - name: Prepare KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install same single APK on Android 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_5
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: bash .github/scripts/fhg-unified-one-apk-smoke.sh
