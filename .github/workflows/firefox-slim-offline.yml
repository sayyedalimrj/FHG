name: FHG Firefox AI web slimming (reuse verified Hiddify bundle)
on:
  push:
    paths:
      - 'firefox/distribution/policies.json'
      - 'packaging/trim-firefox-safe.ps1'
      - '.github/workflows/firefox-slim-offline.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  slim:
    runs-on: windows-2022
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - name: Fetch verified previous full bundle
        env:
          GH_TOKEN: \${{ github.token }}
        shell: pwsh
        run: |
          gh run download 42029203308 -R sayyedalimrj/FHG -n FHG-patched-Hiddify-Proxy-Only-Windows-x64-Experimental -D base
          if($LASTEXITCODE -ne 0) {throw 'Cannot retrieve previous verified full bundle'}
          if(!(Test-Path 'base/FHG-proxy-only-alpha-win-x64.zip')) {throw 'Base ZIP missing'}
      - name: Apply safe Firefox slimming
        shell: pwsh
        run: |
          $z='C:\Program Files\7-Zip\7z.exe'
          & $z t base/FHG-proxy-only-alpha-win-x64.zip | Out-Null
          if($LASTEXITCODE -ne 0) {throw 'Base bundle integrity failed'}
          New-Item -ItemType Directory -Force -Path stage | Out-Null
          & $z x base/FHG-proxy-only-alpha-win-x64.zip -ostage -y | Out-Null
          if($LASTEXITCODE -ne 0) {throw 'Base bundle extraction failed'}
          foreach($required in @('stage/FHG.exe','stage/FHGGuard.exe','stage/Firefox/firefox.exe','stage/Hiddify/Hiddify.exe')) {
            if(!(Test-Path $required)) {throw "Required bundle file missing: $required"}
          }
          Copy-Item firefox/distribution/policies.json stage/Firefox/distribution/policies.json -Force
          ./packaging/trim-firefox-safe.ps1 -FirefoxDirectory stage/Firefox
      - name: Verify essential runtime, proxy and ChatGPT compatibility settings
        shell: pwsh
        run: |
          $p=Get-Content 'stage/Firefox/distribution/policies.json' -Raw | ConvertFrom-Json
          if($p.policies.Proxy.SOCKSProxy -ne '127.0.0.1:12334' -or
             !$p.policies.Proxy.Locked -or !$p.policies.Proxy.UseProxyForDNS -or
             !$p.policies.DisableAppUpdate) {throw 'Proxy or update policies loosened'}
          if($p.policies.DisableFirefoxAccounts -ne $true -or
             $p.policies.NewTabPage -ne $false -or
             $p.policies.SearchSuggestEnabled -ne $false) {throw 'AI-focused settings missing'}
          if(!(Test-Path stage/Firefox/browser/omni.ja) -or
             !(Test-Path stage/Firefox/onnxruntime.dll)) {throw 'Core Firefox runtime removed'}
          $sig=Get-AuthenticodeSignature -LiteralPath stage/Firefox/firefox.exe
          if($sig.Status -ne 'Valid') {throw 'Invalid Firefox signature'}
          $version=& (Resolve-Path stage/Firefox/firefox.exe).Path --version 2>&1 | Out-String
          Write-Host "Firefox smoke version: $version"
          if(!$version.Contains('Mozilla Firefox')) {throw 'Firefox version smoke test failed'}
          Write-Host 'PASS: signed Gecko runtime preserved with AI-focused UI defaults.'
      - name: ZIP, SHA-256 and CRC validation
        shell: pwsh
        run: |
          $z='C:\Program Files\7-Zip\7z.exe'
          $name='FHG-AI-Firefox-Safe-Slim-Windows-x64.zip'
          $out=Join-Path (Get-Location) $name
          Push-Location stage
          try {
            & $z a -tzip -mx=7 $out '*' | Out-Null
            if($LASTEXITCODE -ne 0){throw 'ZIP failed'}
          } finally {Pop-Location}
          & $z t $out | Out-Null
          if($LASTEXITCODE -ne 0) {throw 'ZIP CRC failed'}
          $hash=(Get-FileHash $out -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText("$out.sha256", ($hash+'  '+$name+[Environment]::NewLine), [Text.Encoding]::ASCII)
          Write-Host "PASS: archive SHA256 $hash; bytes:" (Get-Item $out).Length
      - uses: actions/upload-artifact@v4
        with:
          name: FHG-AI-Firefox-Safe-Slim-Windows-x64
          path: |
            FHG-AI-Firefox-Safe-Slim-Windows-x64.zip
            FHG-AI-Firefox-Safe-Slim-Windows-x64.zip.sha256
          if-no-files-found: error
