name: FHG and official Hiddify Android integration smoke
on:
  push:
    branches: [android-hiddify-delegated-20261107]
    paths: ['.github/workflows/fhg-hiddify-deeplink-integration.yml']
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  handoff:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: FHG-HIDDIFY-BRIDGE-SIGNED
          repository: sayyedalimrj/FHG
          run-id: 42366025789
          github-token: ${{ github.token }}
          path: dist
      - name: Fetch immutable official Hiddify v5.5.5 x86_64 release
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c dist/FHG-Secure-Hiddify-Bridge-Android-ARM64.apk.sha256
          curl --fail --location --retry 4 --retry-delay 3 \
            --max-time 300 \
            'https://github.com/hiddify/hiddify-app/releases/download/v5.5.5/Hiddify-Android-x86_64.apk' \
            -o dist/Hiddify-Android-x86_64.apk
          echo '7145da5aac6387db9c9a7c626f7ef362b19191985d942b43b928f7876a4466fb  dist/Hiddify-Android-x86_64.apk' | sha256sum -c -
      - name: Prepare KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install both apps and verify Hiddify import deep link
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_5
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: |
            set -Eeuo pipefail
            adb install -r dist/Hiddify-Android-x86_64.apk | grep -F Success
            adb shell pm path app.hiddify.com | grep -F package:
            adb install -r dist/FHG-Secure-Hiddify-Bridge-Android-ARM64.apk | grep -F Success
            adb shell pm path com.fhg.android.secure.hiddify | grep -F package:
            adb shell am start -W -n com.fhg.android.secure.hiddify/com.fhg.android.MainActivity | grep -F 'Status: ok'
            sleep 3
            adb shell pidof com.fhg.android.secure.hiddify
            # The URI is intentionally synthetic and cannot leak real account data.
            # Only test Android intent resolution; upstream confirms import via UI.
            adb shell am start -W -a android.intent.action.VIEW \
              -c android.intent.category.BROWSABLE \
              -d 'hiddify://import/?url=https%3A%2F%2Fexample.invalid%2Ftest' \
              -p app.hiddify.com | grep -F 'Status: ok'
            sleep 5
            adb shell pidof app.hiddify.com
            adb logcat -d -b crash > /tmp/hiddify-smoke-crash.txt
            ! grep -q -E 'Process: app.hiddify.com|Process: com.fhg.android.secure.hiddify' /tmp/hiddify-smoke-crash.txt
            echo 'PASS: both APKs install and official Hiddify accepts import URI as an Android intent'
