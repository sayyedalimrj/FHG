plugins {
    id 'com.android.application'
}

android {
    namespace 'com.fhg.android'
    compileSdk 36

    defaultConfig {
        applicationId 'com.fhg.android'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0-beta'
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        jniLibs {
            useLegacyPackaging true
        }
    }
}

dependencies {
    implementation 'org.mozilla.geckoview:geckoview:159.0.20261022150525'
}
