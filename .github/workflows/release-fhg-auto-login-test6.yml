name: FHG test.6 Firefox automatic login Windows release
on:
  push:
    branches:
      - fix-original-authenticator-storage-20261106
    paths:
      - .github/workflows/release-fhg-auto-login-test6.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    if: github.repository == 'sayyedalimrj/FHG'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Validate account storage, 2FA and official login stages
        shell: pwsh
        run: |
          foreach ($project in @(
            'native/account-vault-tests/FHG.VaultTests.csproj',
            'native/authenticator-sync-tests/FHG.AuthenticatorSync.Tests.csproj',
            'native/auto-login-tests/FHG.Login.Tests.csproj'
          )) {
            dotnet run --project $project -c Release
            if ($LASTEXITCODE -ne 0) { throw "Regression failed: $project" }
          }
      - name: Build FHG launcher, accounts and login executables
        shell: pwsh
        run: |
          python native/app/resources/generate_icon.py native/original-ui/Assets/FHG.ico
          if ($LASTEXITCODE -ne 0) { throw 'Icon generation failed' }
          foreach ($item in @(
            @('native/original-ui/FHG.csproj','publish-launcher'),
            @('native/account-manager/FHGAccountManager.csproj','publish-accounts'),
            @('native/auto-login/FHGLogin.csproj','publish-login')
          )) {
            dotnet publish $item[0] -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o $item[1]
            if ($LASTEXITCODE -ne 0) { throw "Compile failed: $($item[0])" }
          }
          foreach ($p in @('publish-launcher/FHG.exe','publish-accounts/FHGAccountManager.exe','publish-login/FHGLogin.exe')) {
            if (!(Test-Path $p)) { throw "Missing app executable: $p" }
          }
      - name: Fetch and checksum the official Mozilla geckodriver v0.37.1
        shell: pwsh
        run: |
          $url='https://github.com/mozilla/geckodriver/releases/download/v0.37.1/geckodriver-v0.37.1-win64.zip'
          $zip=Join-Path $env:RUNNER_TEMP 'mozilla-geckodriver-v0.37.1-win64.zip'
          Invoke-WebRequest -Uri $url -OutFile $zip -MaximumRedirection 8
          $actual=(Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne 'dfed9315abe8d2fbc1b6161a2ee8002452e79cf05ee92fdc653a4e26bc35edd8') {
            throw "Official Mozilla geckodriver SHA256 mismatch: $actual"
          }
          New-Item -ItemType Directory stage/WebDriver -Force | Out-Null
          Expand-Archive -LiteralPath $zip -DestinationPath stage/WebDriver -Force
          if (!(Test-Path stage/WebDriver/geckodriver.exe)) {
            throw 'Official geckodriver executable missing'
          }
          & stage/WebDriver/geckodriver.exe --version
          if ($LASTEXITCODE -ne 0) { throw 'Geckodriver binary failed to execute' }
          Write-Host 'PASS: official Mozilla geckodriver downloaded and pinned to release SHA256'
      - name: Reuse test.5 signed Firefox/Auth, dedicated Hiddify and Guard unchanged
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download v0.6.0-test.5 --repo $env:GITHUB_REPOSITORY --pattern FHG-Setup-Windows-x64-0.6.0-preview.exe --dir $env:RUNNER_TEMP
          if ($LASTEXITCODE -ne 0) { throw 'Cannot download previously tested FHG release' }
          $old=Join-Path $env:RUNNER_TEMP 'FHG-Setup-Windows-x64-0.6.0-preview.exe'
          $hash=(Get-FileHash $old -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne '2ff9e0d14ea384d04e803a2d108f6ffcba1465d882b8e9aa38634903e4dd268e') {
            throw 'Existing FHG release pin mismatch; refusing to swap Firefox or Hiddify binaries'
          }
          $base=Join-Path $env:RUNNER_TEMP 'FHGStableTest5'
          $install=Start-Process -FilePath $old -PassThru -Wait -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-',("/DIR="+$base))
          if ($install.ExitCode -ne 0) { throw 'Could not stage old FHG release' }
          foreach ($p in @('FHG.exe','FHGAccountManager.exe','FHGAuthenticatorSync.exe','FHGGuard.exe','Hiddify/FHGProxy.exe','Firefox/firefox.exe','Firefox/distribution/fhg-authenticator.xpi')) {
            if (!(Test-Path (Join-Path $base $p))) { throw "Missing baseline component: $p" }
          }
          Copy-Item (Join-Path $base '*') stage -Recurse -Force
          Copy-Item publish-launcher/FHG.exe stage/FHG.exe -Force
          Copy-Item publish-accounts/FHGAccountManager.exe stage/FHGAccountManager.exe -Force
          Copy-Item publish-login/FHGLogin.exe stage/FHGLogin.exe -Force
          foreach ($immutable in @('FHGGuard.exe','FHGAuthenticatorSync.exe','Hiddify/FHGProxy.exe','Firefox/firefox.exe','Firefox/distribution/fhg-authenticator.xpi')) {
            $a=(Get-FileHash (Join-Path $base $immutable) -Algorithm SHA256).Hash
            $b=(Get-FileHash (Join-Path stage $immutable) -Algorithm SHA256).Hash
            if ($a -ne $b) { throw "Previously working binary was changed: $immutable" }
          }
          if (Test-Path stage/Firefox/distribution/fhg-auto-authenticator.xpi) { throw 'Custom Authenticator add-on must never be bundled' }
          Write-Host 'PASS: original mymindstorm extension, Firefox/Hiddify/Guard unchanged'
      - name: Actual offline Firefox plus WebDriver E2E smoke test
        shell: pwsh
        run: |
          $process=Start-Process -FilePath (Resolve-Path stage/FHGLogin.exe).Path -PassThru -Wait -ArgumentList @('--self-test-driver') -NoNewWindow
          if ($process.ExitCode -ne 0) {
            throw "Firefox+geckodriver synthetic form smoke failed: $($process.ExitCode)"
          }
          Write-Host 'PASS: the real bundled Firefox submitted a local synthetic form using the packaged WebDriver'
      - name: Compile and smoke-test full Windows installer
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup install failed' }
          & 'C:/Program Files (x86)/Inno Setup 6/ISCC.exe' packaging/FHG-Setup.iss
          if ($LASTEXITCODE -ne 0) { throw 'Full installer compilation failed' }
          $installer='installer-output/FHG-Setup-Windows-x64-0.6.0-preview.exe'
          if (!(Test-Path $installer)) { throw 'Missing single-file setup EXE' }
          $target=Join-Path $env:RUNNER_TEMP 'FHGTest6Installed'
          $result=Start-Process -FilePath (Resolve-Path $installer).Path -Wait -PassThru -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-',("/DIR="+$target))
          if ($result.ExitCode -ne 0) { throw "Inno Setup installation failed: $($result.ExitCode)" }
          foreach ($p in @('FHG.exe','FHGAccountManager.exe','FHGAuthenticatorSync.exe','FHGLogin.exe','WebDriver/geckodriver.exe','Firefox/firefox.exe','Hiddify/FHGProxy.exe','FHGGuard.exe','Firefox/distribution/fhg-authenticator.xpi')) {
            if (!(Test-Path (Join-Path $target $p))) { throw "Installed component missing: $p" }
            if ((Get-FileHash (Join-Path $target $p)).Hash -ne (Get-FileHash (Join-Path stage $p)).Hash) {
              throw "Installed binary damaged: $p"
            }
          }
          if (Test-Path (Join-Path $target 'Firefox/distribution/fhg-auto-authenticator.xpi')) { throw 'Unwanted custom add-on installed' }
          $hash=(Get-FileHash $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText(($installer+'.sha256'),($hash+'  FHG-Setup-Windows-x64-0.6.0-preview.exe'+[Environment]::NewLine),[Text.Encoding]::ASCII)
          Write-Host "PASS: installed FHG test.6 EXE, SHA256 $hash"
      - uses: actions/upload-artifact@v4
        with:
          name: FHG-Windows-x64-Automatic-Login-v0.6.0-test.6
          path: |
            installer-output/FHG-Setup-Windows-x64-0.6.0-preview.exe
            installer-output/FHG-Setup-Windows-x64-0.6.0-preview.exe.sha256
          if-no-files-found: error
          retention-days: 7
      - name: Publish test.6 release without replacing existing assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download v0.6.0-test.5 --repo $env:GITHUB_REPOSITORY --pattern FHG-HIDDIFY-SOURCE.patch --dir .
          if ($LASTEXITCODE -ne 0) { throw 'GPL Hiddify source patch missing' }
          gh release view v0.6.0-test.6 --repo $env:GITHUB_REPOSITORY --json tagName 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) { throw 'Release test6 already exists; refusing to replace it' }
          $ok=$false
          for($i=1;$i -le 4;$i++){
            gh release create v0.6.0-test.6 installer-output/FHG-Setup-Windows-x64-0.6.0-preview.exe installer-output/FHG-Setup-Windows-x64-0.6.0-preview.exe.sha256 FHG-HIDDIFY-SOURCE.patch --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title 'FHG test.6 Auto ChatGPT Login + Original Authenticator (UNSIGNED)' --notes-file docs/RELEASE-v0.6.0-test.6.md --prerelease --latest=false
            if ($LASTEXITCODE -eq 0) { $ok=$true;break }
            Start-Sleep -Seconds (5*$i)
          }
          if (!$ok) { throw 'Release API failed. The verified installer is still in GitHub Actions artifacts.' }
