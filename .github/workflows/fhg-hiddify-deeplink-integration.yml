name: FHG and official Hiddify Android integration smoke
on:
  push:
    branches: [android-hiddify-delegated-20261107]
    paths:
      - '.github/workflows/fhg-hiddify-deeplink-integration.yml'
      - '.github/scripts/fhg-hiddify-integrate-smoke.sh'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  handoff:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: FHG-HIDDIFY-BRIDGE-SIGNED
          repository: sayyedalimrj/FHG
          run-id: 42366025789
          github-token: ${{ github.token }}
          path: dist
      - name: Fetch immutable official Hiddify v5.5.5 x86_64 release
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c dist/FHG-Secure-Hiddify-Bridge-Android-ARM64.apk.sha256
          curl --fail --location --retry 4 --retry-delay 3 \
            --max-time 300 \
            'https://github.com/hiddify/hiddify-app/releases/download/v5.5.5/Hiddify-Android-x86_64.apk' \
            -o dist/Hiddify-Android-x86_64.apk
          echo '7145da5aac6387db9c9a7c626f7ef362b19191985d942b43b928f7876a4466fb  dist/Hiddify-Android-x86_64.apk' | sha256sum -c -
      - name: Prepare KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install both apps and verify Hiddify import deep link
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_5
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: bash .github/scripts/fhg-hiddify-integrate-smoke.sh
