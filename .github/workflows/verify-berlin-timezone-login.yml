name: Verify FHG Berlin timezone and safe login
on:
  push:
    branches: [fix-berlin-timezone-first-run-login-20261106]
    paths:
      - 'native/auto-login/**'
      - 'native/original-ui/**'
      - 'native/workspace-ui/**'
      - '.github/workflows/verify-berlin-timezone-login.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: {dotnet-version: '10.0.x'}
      - name: Build and verify safe-login and first-run source
        shell: pwsh
        run: |
          python native/app/resources/generate_icon.py native/original-ui/Assets/FHG.ico
          dotnet publish native/auto-login/FHGLogin.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o publish-login
          if ($LASTEXITCODE -ne 0) { throw 'Login build failed' }
          dotnet publish native/workspace-ui/FHGWorkspace.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o publish-accounts
          if ($LASTEXITCODE -ne 0) { throw 'Account Workspace build failed' }
          dotnet publish native/original-ui/FHG.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o publish-launcher
          if ($LASTEXITCODE -ne 0) { throw 'Launcher build failed' }
          $login = Get-Content native/auto-login/Program.cs -Raw
          $ui = Get-Content native/workspace-ui/Program.cs -Raw
          if ($login.Contains('browser.Enter(elementId)') -or $login.Contains('browser.GoTo("https://chatgpt.com/auth/login")')) { throw 'Legacy blind Enter/deep-link login behavior returned' }
          if (!$ui.Contains('Shown += (_,_)') -or !$ui.Contains('Safely(AddAccount)')) { throw 'First-run automatic local file picker missing' }
          Write-Host 'PASS: no special Enter sent, direct official login path removed, first-run picker automatic'
      - name: Fetch and verify signed timezone addon from Mozilla Add-ons
        shell: pwsh
        run: |
          $url='https://addons.mozilla.org/firefox/downloads/latest/spoof-timezone/latest.xpi'
          New-Item -ItemType Directory stage/Firefox/distribution -Force | Out-Null
          $xpi=(Resolve-Path stage/Firefox/distribution).Path + '/fhg-timezone.xpi'
          Invoke-WebRequest -Uri $url -OutFile $xpi -MaximumRedirection 12
          if (!(Test-Path $xpi)) { throw 'Signed AMO addon unavailable' }
          Add-Type -AssemblyName System.IO.Compression
          $archive=[IO.Compression.ZipFile]::OpenRead($xpi)
          try {
            $manifestEntry=$archive.GetEntry('manifest.json')
            if ($null -eq $manifestEntry) { throw 'Signed addon missing manifest' }
            $reader=[IO.StreamReader]::new($manifestEntry.Open())
            try { $manifest=$reader.ReadToEnd()|ConvertFrom-Json }
            finally { $reader.Dispose() }
            if ($manifest.version -ne '0.5.0' -or
              $manifest.browser_specific_settings.gecko.id -ne '{55f61747-c3d3-4425-97f9-dfc19a0be23c}') {
              throw 'Unexpected addon version or identity'
            }
            $signatures=@($archive.Entries | Where-Object FullName -like 'META-INF/*')
            if ($signatures.Count -lt 2) { throw 'No XPI signature files present' }
          } finally { $archive.Dispose() }
          $hash=(Get-FileHash $xpi -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne '542422365981287388c243ab60c4ac3b62df6713a8c00761fdff9fc06f70ba6f') {
            throw 'Mozilla signed Spoof Timezone 0.5.0 archive hash changed; do not silently replace it'
          }
          Write-Host "PASS: Mozilla-signed timezone 0.5.0 SHA256=$hash"
          [IO.File]::WriteAllText($xpi+'.sha256',$hash + '  fhg-timezone.xpi'+[Environment]::NewLine,[Text.Encoding]::ASCII)
      - name: Stage the exact previously released Firefox and original Authenticator
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download v0.6.0-test.7 --repo $env:GITHUB_REPOSITORY --pattern FHG-Setup-Windows-x64-0.6.0-preview.exe --dir $env:RUNNER_TEMP
          if ($LASTEXITCODE -ne 0) { throw 'Missing previous release' }
          $setup=Join-Path $env:RUNNER_TEMP 'FHG-Setup-Windows-x64-0.6.0-preview.exe'
          if ((Get-FileHash $setup -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'fa93baf79a91f6da0516566f8b874d24cfa6073c7d4429a1056c2388545cb555') {
            throw 'Baseline hash mismatch'
          }
          $dest=Join-Path $env:RUNNER_TEMP 'FHGTimeZoneTest'
          $result=Start-Process -FilePath $setup -PassThru -Wait -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-',("/DIR="+$dest))
          if ($result.ExitCode -ne 0) { throw 'Cannot extract baseline' }
          Copy-Item (Join-Path $dest '*') stage -Recurse -Force
          Copy-Item publish-login/FHGLogin.exe stage/FHGLogin.exe -Force
          Copy-Item publish-launcher/FHG.exe stage/FHG.exe -Force
          Copy-Item publish-accounts/FHGAccountManager.exe stage/FHGAccountManager.exe -Force
          $policyPath='stage/Firefox/distribution/policies.json'
          $policy=Get-Content $policyPath -Raw|ConvertFrom-Json
          $xpi=(Resolve-Path stage/Firefox/distribution/fhg-timezone.xpi).Path
          $policy.policies.ExtensionSettings | Add-Member -NotePropertyName '{55f61747-c3d3-4425-97f9-dfc19a0be23c}' -NotePropertyValue @{installation_mode='force_installed';install_url=([uri]$xpi).AbsoluteUri} -Force
          $auth=(Resolve-Path stage/Firefox/distribution/fhg-authenticator.xpi).Path
          $policy.policies.ExtensionSettings.'authenticator@mymindstorm'.install_url=([uri]$auth).AbsoluteUri
          $policy | ConvertTo-Json -Depth 25 | Set-Content $policyPath -Encoding utf8
          Write-Host 'PASS: original Authenticator retained, signed timezone addon added to temporary test only'
      - name: Run real Firefox offline signup-input and signed timezone regression
        shell: pwsh
        run: |
          Push-Location stage
          try {
            & ./FHGLogin.exe --self-test-driver
            if ($LASTEXITCODE -ne 0) {throw "Firefox form and addon test failed: $LASTEXITCODE"}
          } finally {Pop-Location}
      - uses: actions/upload-artifact@v4
        with:
          name: FHG-BERLIN-TIMEZONE-XPI-AND-BINARIES
          path: |
            stage/Firefox/distribution/fhg-timezone.xpi
            stage/Firefox/distribution/fhg-timezone.xpi.sha256
            stage/FHG.exe
            stage/FHGLogin.exe
            stage/FHGAccountManager.exe
          retention-days: 7
          if-no-files-found: error
