name: Policy validation
on:
  push:
  pull_request:
jobs:
  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check Firefox distribution policy
        shell: python
        run: |
          import json
          from pathlib import Path
          p=json.loads(Path("firefox/distribution/policies.json").read_text(encoding="utf-8"))["policies"]
          proxy=p["Proxy"]
          assert proxy["Mode"]=="manual" and proxy["Locked"] is True
          assert proxy["SOCKSProxy"]=="127.0.0.1:12345"
          assert proxy["SOCKSVersion"]==5 and proxy["UseProxyForDNS"] is True
          assert proxy["Passthrough"]==""
          assert p["Preferences"]["media.peerconnection.enabled"]=={"Value": False, "Status": "locked"}
          assert p["RequestedLocales"][0]=="en-US"
          assert p["OverrideFirstRunPage"]==""
          assert p["DisplayBookmarksToolbar"]=="always"
          assert any(b["URL"]=="https://chatgpt.com/" and b["Placement"]=="toolbar" for b in p["Bookmarks"])
          addon=p["ExtensionSettings"]["authenticator@mymindstorm"]
          assert addon["installation_mode"]=="force_installed"
          assert addon["install_url"]=="https://addons.mozilla.org/firefox/downloads/latest/auth-helper/latest.xpi"
          assert p["Homepage"]["URL"]=="https://chatgpt.com/"
          assert p["Homepage"]["StartPage"]=="homepage"
          assert p["NewTabPage"] is True
          assert p["FirefoxHome"]["TopSites"] is True
          assert p["FirefoxHome"]["SponsoredTopSites"] is False
          assert p["Preferences"]["browser.aboutwelcome.enabled"]=={"Value": False, "Status": "locked"}
          assert p["DisableProfileImport"] is True, "FHG may not import regular Firefox data"
          assert p["DisableDefaultBrowserAgent"] is True
          assert p["DefaultBrowserSettingEnabled"] is False
          assert p["DontCheckDefaultBrowser"] is True
          launcher=Path("native/original-ui/Program.cs").read_text(encoding="utf-8")
          account_paths=Path("native/original-ui/AccountPaths.cs").read_text(encoding="utf-8")
          installer=Path("packaging/FHG-Setup.iss").read_text(encoding="utf-8")
          assert 'Path.Combine(Root, "Firefox")' in launcher
          assert 'Path.Combine(FirefoxDir, "firefox.exe")' in launcher
          assert 'browser.ArgumentList.Add("-no-remote")' in launcher
          assert 'browser.ArgumentList.Add("-profile")' in launcher
          assert 'browser.ArgumentList.Add(ProfileDir)' in launcher
          assert 'Refusing to launch a Firefox executable or profile outside isolated FHG directories.' in launcher
          assert 'Environment.SpecialFolder.LocalApplicationData' in account_paths
          assert 'FirefoxProfile' in account_paths and '"FHG", "Accounts"' in account_paths
          assert "ChangesAssociations=no" in installer
          assert "PrivilegesRequired=lowest" in installer
          assert "Software\\\\Clients\\\\StartMenuInternet" not in installer
          assert "HKCR" not in installer and "HKLM" not in installer
          print("PASS: independently bundled Firefox, isolated per-user profiles, no system browser takeover")
          print("Firefox policy static validation passed. This is NOT a leak test.")
