name: Windows FHG controller x64
on:
  push:
    paths:
      - "native/app/**"
      - "ui/**"
      - "native/guard/**"
      - "firefox/distribution/**"
      - ".github/workflows/windows-controller.yml"
      - "packaging/**"
  pull_request:
    paths:
      - "native/app/**"
      - "native/guard/**"
      - "firefox/distribution/**"
      - ".github/workflows/windows-controller.yml"
      - "packaging/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Generate original FHG multi-resolution icon
        run: python native/app/resources/generate_icon.py ui/Assets/FHG.ico
      - name: Publish self-contained WPF interface
        shell: pwsh
        run: |
          dotnet publish ui/FHG.UI.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o publish-ui
          if ($LASTEXITCODE -ne 0) { throw 'WPF publish failed' }
          if (!(Test-Path 'publish-ui/FHG.exe')) { throw 'FHG.exe missing' }
      - name: Configure guard
        run: cmake -S native/guard -B build-guard -G "Visual Studio 17 2022" -A x64
      - name: Compile guard
        run: cmake --build build-guard --config Release --parallel
      - name: Publisher signing (only with valid repository code-signing certificate)
        shell: pwsh
        env:
          FHG_SIGNING_PFX_BASE64: ${{ secrets.FHG_SIGNING_PFX_BASE64 }}
          FHG_SIGNING_PFX_PASSWORD: ${{ secrets.FHG_SIGNING_PFX_PASSWORD }}
        run: |
          ./packaging/sign-publisher.ps1 -Controller publish-ui/FHG.exe -Guard build-guard/Release/FHGGuard.exe
      - name: Verify embedded FHG icon and Authenticode statuses
        shell: pwsh
        run: |
          ./native/app/resources/check-icon-signature.ps1 -Controller publish-ui/FHG.exe -Guard build-guard/Release/FHGGuard.exe
      - name: Audit app icon and Authenticode status
        shell: pwsh
        run: |
          $exe = "publish-ui/FHG.exe"
          $bytes = [IO.File]::ReadAllBytes((Resolve-Path $exe).Path)
          $text = [Text.Encoding]::Unicode.GetString($bytes)
          if (!$text.Contains("FHG Secure Browser Experimental")) { throw "Missing embedded version resource" }
          $s = Get-AuthenticodeSignature $exe
          Write-Host "FHG Authenticode:" $s.Status
          if ($s.Status -eq 'Valid') { Write-Host "Certificate signer:" $s.SignerCertificate.Subject }
          else { Write-Warning "FHG is UNSIGNED. A trusted Code Signing certificate is required for public signing." }
          Get-FileHash $exe -Algorithm SHA256 | Format-List
          Get-FileHash "build-guard/Release/FHGGuard.exe" -Algorithm SHA256 | Format-List
      - name: Package UI and guard components
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item publish-ui/FHG.exe dist/FHG.exe
          Copy-Item build-guard/Release/FHGGuard.exe dist/FHGGuard.exe
          Copy-Item firefox/distribution/policies.json dist/policies.json
      - name: Assemble offline experimental browser
        shell: pwsh
        run: |
          ./packaging/build-offline.ps1 -Controller publish-ui/FHG.exe -Guard build-guard/Release/FHGGuard.exe
      - name: Create SHA-256 download checksum
        shell: pwsh
        run: |
          $package = 'FHG-experimental-win-x64.zip'
          if (!(Test-Path -LiteralPath $package)) { throw 'FHG package missing' }
          $hash = (Get-FileHash -LiteralPath $package -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText((Join-Path (Get-Location) ($package + '.sha256')), ($hash + '  ' + $package + "`n"), [Text.Encoding]::ASCII)
          Write-Host "SHA256: $hash  $package"
      - name: Attest official build provenance (not an Authenticode signature)
        if: github.event_name != 'pull_request'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: FHG-experimental-win-x64.zip
      - name: Upload offline experimental browser
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: FHG-experimental-OFFLINE-browser-windows-x64
          path: |
            FHG-experimental-win-x64.zip
            FHG-experimental-win-x64.zip.sha256
          if-no-files-found: error
      - name: Upload experimental components
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: FHG-experimental-controller-x64
          path: dist/*
          if-no-files-found: error
