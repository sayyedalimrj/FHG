name: FHG patched Hiddify Proxy-only Windows
concurrency:
  group: fhg-proxy-only-${{ github.ref }}
  cancel-in-progress: true
on:
  push:
    branches: [main, feature-exe-installer-dpapi-accounts-20261105]
    paths:
      - 'packaging/patch-hiddify-proxy-only.py'
      - 'packaging/rebrand-hiddify.py'
      - 'packaging/bundle-totp-addon.ps1'
      - 'packaging/FHG-Diagnose.ps1'
      - 'packaging/sign-publisher.ps1'
      - 'docs/CONNECTIVITY-DIAGNOSTICS.md'
      - 'native/original-ui/Program.cs'
      - 'native/original-ui/FirstRunWizard.cs'
      - 'native/first-run-tests/FHG.FirstRun.Tests.csproj'
      - 'native/first-run-tests/Program.cs'
      - 'native/account-manager/Program.cs'
      - 'native/account-manager/AccountVault.cs'
      - 'native/account-manager/FHGAccountManager.csproj'
      - 'native/account-vault-tests/Program.cs'
      - 'native/account-vault-tests/FHG.VaultTests.csproj'
      - 'native/original-ui/AccountPaths.cs'
      - 'packaging/FHG-Setup.iss'
      - 'packaging/FHG-Diagnose.cmd'
      - 'docs/FIRST-RUN-LOCAL-SETUP.md'
      - 'native/original-ui/FHG.csproj'
      - 'native/guard/FHGGuard.cpp'
      - 'native/guard/test-egress.ps1'
      - 'docs/RELEASE-v0.5.2-rc.1.md'
      - 'docs/RELEASE-v0.6.0-rc.1.md'
      - 'docs/RELEASE-v0.6.0-test.1.md'
      - 'docs/RELEASE-v0.6.0-test.2.md'
      - 'docs/RELEASE-v0.6.0-test.3.md'
      - 'firefox/distribution/policies.json'
      - 'packaging/trim-firefox-safe.ps1'
      - '.github/workflows/hiddify-proxy-only.yml'
      - 'docs/HIDDIFY-PROXY-ONLY.md'
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - name: Validate diagnostic PowerShell syntax before any expensive build
        shell: pwsh
        run: |
          $tokens=$null
          $errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path packaging/FHG-Diagnose.ps1).Path,[ref]$tokens,[ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Error $_.Message }; throw 'FHG-Diagnose.ps1 has syntax errors' }
          Write-Host 'PASS: read-only diagnostic script parses on Windows PowerShell 7 (PowerShell 5.1 syntax compatible)'
      - name: Checkout pinned upstream Hiddify
        shell: pwsh
        run: |
          git clone --depth 1 --branch v5.5.5 https://github.com/hiddify/hiddify-app.git vendor
          if ($LASTEXITCODE -ne 0) {throw 'Upstream clone failed'}
          $sha=(git -C vendor rev-parse HEAD).Trim()
          if ($sha -ne '7804cadac01419f31b1ec7802d9e1be599e66de2') {throw "Unexpected upstream commit: $sha"}
      - name: Patch source and check network invariants
        shell: pwsh
        run: |
          python packaging/patch-hiddify-proxy-only.py vendor
          if ($LASTEXITCODE -ne 0) {throw 'Source patch failed'}
          python packaging/rebrand-hiddify.py vendor
          if ($LASTEXITCODE -ne 0) {throw 'FHG rebrand patch failed'}
          git -C vendor diff --check
          if ($LASTEXITCODE -ne 0) {throw 'Source patch whitespace error'}
          git -C vendor diff | Out-File -FilePath FHG-HIDDIFY-SOURCE.patch -Encoding utf8
          $config=Get-Content vendor/lib/features/settings/data/config_option_repository.dart -Raw
          foreach($key in @("'enable-tun': false", "'set-system-proxy': false", "'mixed-port': 12345", "'clash-api-port': 26756", "'chain-status': ChainStatus.off.key", "'allow-connection-from-lan': false")) {
            if (!$config.Contains($key)) {throw "Runtime invariant missing: $key"}
          }
          $nav=Get-Content vendor/lib/core/router/adaptive_layout/my_adaptive_layout.dart -Raw
          if ($nav.Contains('ShellRouteAction(Icons.description_rounded, t.pages.logs.title)') -or $nav.Contains('ShellRouteAction(Icons.info_rounded, t.pages.about.title)')) {throw 'Log/About buttons remain in desktop UI'}
          $locale=Get-Content vendor/lib/core/localization/locale_preferences.dart -Raw
          if (!$locale.Contains('if (persisted == null) return AppLocale.en;')) {throw 'English is not the default locale'}
          $analytics=Get-Content vendor/lib/core/analytics/analytics_controller.dart -Raw
          if ($analytics.Contains('SentryFlutter.init')) {throw 'Sentry activation still present'}
          $runner=Get-Content vendor/windows/runner/main.cpp -Raw
          $dirs=Get-Content vendor/lib/core/directories/directories_provider.dart -Raw
          $tray=Get-Content vendor/lib/features/system_tray/notifier/system_tray_notifier.dart -Raw
          $links=Get-Content vendor/lib/core/router/deep_linking/my_app_links.dart -Raw
          if (!$runner.Contains('FHGProxyMutex') -or $runner.Contains('HiddifyMutex')) {throw 'Native GUI still conflicts with ordinary Hiddify'}
          if (!$dirs.Contains('fhg_proxy_portable_data')) {throw 'Dedicated data folder missing'}
          if (!$tray.Contains("key: 'fhg-proxy-locked'")) {throw 'Locked proxy-only tray label is missing'}
          if ($links.Contains('registerProtocolHandler(protocol);')) {throw 'FHG still overwrites original Hiddify protocol handlers'}
          $grpc=Get-Content vendor/lib/hiddifycore/core_interface/core_interface_desktop_tun.dart -Raw
          $bootstrap=Get-Content vendor/lib/bootstrap.dart -Raw
          $core=Get-Content vendor/lib/hiddifycore/hiddify_core_service.dart -Raw
          if (!$grpc.Contains('super(port: 27178)') -or $grpc.Contains('super(port: 17078)')) {throw 'Hiddify internal gRPC still conflicts with normal Hiddify'}
          if (!$bootstrap.Contains("fhg_english_default_initialized")) {throw 'FHG English first-launch migration absent'}
          if (!$core.Contains("FHG core did not start.") -or !$core.Contains("await setup().run();")) {throw 'Missing core recovery retry and error diagnostic'}
          $conn=Get-Content vendor/lib/features/connection/data/connection_repository.dart -Raw
          if (!$conn.Contains("(singbox.core as CoreInterfaceDesktopTun).useAdminBgService = false")) {throw 'FHG must never request vendor HiddifyAdmin elevation for proxy-only mode'}
          $http=Get-Content vendor/lib/core/http_client/dio_http_client.dart -Raw
          $parser=Get-Content vendor/lib/features/profile/data/profile_parser.dart -Raw
          $fhgHomeSource=Get-Content vendor/lib/features/home/widget/home_page.dart -Raw
          if (!$http.Contains('FHG_BOOTSTRAP_HTTP_PROXY') -or !$http.Contains('PROXY $bootstrap') -or !$http.Contains('return "PROXY $proxy";') -or !$http.Contains('bootstrapApproved ? "direct"')) {throw 'User-approved bootstrapping must take priority over an inactive local FHG proxy, without DIRECT fallback'}
          if (!$parser.Contains('Duration(seconds: 40)') -or !$parser.Contains('ProfileFailure.invalidUrl')) {throw 'Bounded subscription import diagnostic absent'}
          if (!$fhgHomeSource.Contains("const TextSpan(text: 'FHG Proxy')")) {throw 'Home banner still says Hiddify'}
          $keep=Get-Content vendor/lib/features/proxy/keep_top/keep_top.dart -Raw
          if (!$keep.Contains('FHG automatically selected all nodes for a big subscription') -or
              !$keep.Contains('int get keepTop => userOverride?.keepTop ?? -1;')) {
            throw 'FHG large subscriptions must default to all nodes without a popup'
          }
          $accounts=Get-Content native/account-manager/Program.cs -Raw
          foreach($marker in @('UpdateAllCodes()', 'CopyCode(FhgAccount account)', 'Height = 146', 'otpTimer.Start();')) {
            if (!$accounts.Contains($marker)) {throw "FHG Accounts card and automatic live 2FA missing: $marker"}
          }
          $setup=Get-Content vendor/lib/bootstrap.dart -Raw
          $gui=Get-Content native/original-ui/Program.cs -Raw
          $wizard=Get-Content native/original-ui/FirstRunWizard.cs -Raw
          if (!$setup.Contains('_fhgOneTimeSubscription') -or !$setup.Contains("FHG_INITIAL_SUB_FILE") -or !$setup.Contains("upsertRemote(url)") -or !$setup.Contains('restoreConnectionOnStartup()')) {throw 'One-time subscription native import is missing'}
          if (!$gui.Contains('WaitForSubscriptionReceipt') -or !$gui.Contains('WaitForFhgProxyHttps')) {throw 'First-run receipt or authenticated SOCKS readiness gate missing'}
          if (!$wizard.Contains('Exactly four lines') -or !$wizard.Contains('Uri.UriSchemeHttps')) {throw 'First-run input validation missing'}
          Write-Host 'PASS: one-time subscription import, guarded readiness and input validation source checks'
          Write-Host 'PASS: bounded bootstrap import, branded UI, independent control RPC and proper diagnostics'
          Write-Host 'PASS: proxy-only policy, renamed GUI, isolated data and protected default handlers'
      - uses: subosito/flutter-action@v2.21.0
        with:
          flutter-version: '3.38.5'
          channel: stable
          cache: true
      - name: Prepare upstream Flutter and native Core
        shell: bash
        working-directory: vendor
        run: |
          set -euo pipefail
          make windows-prepare
      - name: Hiddify behavior tests (subscription parsing, persistence, startup, network, nodes)
        shell: pwsh
        working-directory: vendor
        env:
          SENTRY_DSN: ''
        run: |
          $tests=@(
            'test/core/http_client/user_agent_test.dart',
            'test/features/profile/data/profile_parser_test.dart',
            'test/features/profile/data/profile_repository_test.dart',
            'test/features/settings/data/config_option_repository_test.dart',
            'test/features/connection/model/startup_connection_test.dart',
            'test/features/connection/notifier/disconnect_completes_test.dart',
            'test/features/proxy/connection_health_test.dart',
            'test/hiddifycore/core_interface/start_once_stopped_test.dart'
          )
          foreach($file in $tests) {
            Write-Host "Testing Hiddify behavior: $file"
            flutter test $file --reporter expanded
            if ($LASTEXITCODE -ne 0) {throw "Hiddify functional regression failed: $file"}
          }
      - name: Compile patched native Windows Flutter UI
        shell: pwsh
        working-directory: vendor
        env:
          SENTRY_DSN: ''
        run: |
          flutter build windows --release --target lib/main_prod.dart --dart-define=portable=true --dart-define=sentry_dsn=
          if ($LASTEXITCODE -ne 0) {throw 'Patched Flutter compile failed'}
          if (!(Test-Path 'build/windows/x64/runner/Release/FHGProxy.exe')) {throw 'No patched FHGProxy.exe'}
          if (!(Test-Path 'build/windows/x64/runner/Release/data/flutter_assets')) {throw 'No patched Flutter UI assets'}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Verify local first-run parser with dummy inputs only
        shell: pwsh
        run: |
          dotnet run --project native/first-run-tests/FHG.FirstRun.Tests.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw 'FHG local first-run parser tests failed' }
      - name: Test Windows DPAPI account vault and RFC 6238 using synthetic credentials
        shell: pwsh
        run: |
          dotnet run --project native/account-vault-tests/FHG.VaultTests.csproj -c Release
          if ($LASTEXITCODE -ne 0) {throw 'FHG DPAPI vault or OTP test failed'}
      - name: Build self-contained FHG Account Manager EXE
        shell: pwsh
        run: |
          python native/app/resources/generate_icon.py native/original-ui/Assets/FHG.ico
          if ($LASTEXITCODE -ne 0) {throw 'FHG account-manager icon generation failed'}
          dotnet publish native/account-manager/FHGAccountManager.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o publish-accounts
          if ($LASTEXITCODE -ne 0) {throw 'FHGAccountManager compile failed'}
          if (!(Test-Path publish-accounts/FHGAccountManager.exe)) {throw 'Standalone account manager EXE missing'}
      - name: Compile updated FHG launcher and fix WFP guard non-admin status
        shell: pwsh
        run: |
          python native/app/resources/generate_icon.py native/original-ui/Assets/FHG.ico
          dotnet publish native/original-ui/FHG.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o publish-launcher
          if ($LASTEXITCODE -ne 0) {throw 'FHG launcher compile failed'}
          cmake -S native/original-ui -B build-guard -G "Visual Studio 17 2022" -A x64
          if ($LASTEXITCODE -ne 0) {throw 'FHG Guard configure failed'}
          cmake --build build-guard --config Release --parallel
          if ($LASTEXITCODE -ne 0) {throw 'FHG Guard build failed'}
          cmake --build build-guard --config Release --target FHGProbe
          if ($LASTEXITCODE -ne 0) {throw 'FHG probe build failed'}
          if (!(Test-Path 'publish-launcher/FHG.exe') -or !(Test-Path 'build-guard/Release/FHGGuard.exe')) {throw 'Launcher or Guard missing'}
      - name: Sign native FHG components and modified FHGProxy when publisher certificate is available
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          FHG_SIGNING_PFX_BASE64: ${{ secrets.FHG_SIGNING_PFX_BASE64 }}
          FHG_SIGNING_PFX_PASSWORD: ${{ secrets.FHG_SIGNING_PFX_PASSWORD }}
        run: |
          ./packaging/sign-publisher.ps1 -Controller publish-launcher/FHG.exe -Guard build-guard/Release/FHGGuard.exe -ProxyExe vendor/build/windows/x64/runner/Release/FHGProxy.exe -AccountManager publish-accounts/FHGAccountManager.exe
          foreach($p in @('publish-launcher/FHG.exe','build-guard/Release/FHGGuard.exe','vendor/build/windows/x64/runner/Release/FHGProxy.exe','publish-accounts/FHGAccountManager.exe')) {
            $sig=(Get-AuthenticodeSignature $p).Status
            Write-Host "Publisher-signing status for $p : $sig"
          }
      - name: Regression test app-only WFP protection (TCP IPv4 and IPv6)
        shell: pwsh
        run: |
          ./native/guard/test-egress.ps1 -GuardPath (Resolve-Path 'build-guard/Release/FHGGuard.exe').Path -ProbePath (Resolve-Path 'build-guard/Release/FHGProbe.exe').Path
      - name: Regression test unauthenticated startup without repeat UAC
        shell: pwsh
        run: |
          ./native/guard/test-nonadmin-status.ps1 -GuardPath (Resolve-Path 'build-guard/Release/FHGGuard.exe').Path -ProbePath (Resolve-Path 'build-guard/Release/FHGProbe.exe').Path
      - name: Fetch validated FHG base v0.4
        shell: pwsh
        run: |
          $url='https://github.com/sayyedalimrj/FHG/releases/download/v0.4.0-alpha.1/FHG-original-Hiddify-UI-windows-x64.zip'
          $expectedBase='56254841405e8a681f32ee52a00b3f6fffa8d7e2ac0f7c57c3f28f38bd94c1d1'
          $downloaded=$false
          for($attempt=1; $attempt -le 8; $attempt++){
            try {
              Write-Host "Downloading validated base archive (attempt $attempt / 8)"
              & curl.exe -fSL --retry 2 --retry-all-errors --retry-delay 4 --connect-timeout 25 --max-time 420 -o FHG-base.zip $url
              if ($LASTEXITCODE -ne 0) {throw "curl.exe returned exit code $LASTEXITCODE"}
              $hash=(Get-FileHash FHG-base.zip -Algorithm SHA256).Hash.ToLowerInvariant()
              if ($hash -ne $expectedBase) {throw "Base SHA256 mismatch: $hash"}
              $downloaded=$true
              break
            } catch {
              Write-Warning "Base archive download attempt $attempt failed: $($_.Exception.Message)"
              Remove-Item FHG-base.zip -ErrorAction SilentlyContinue
              if ($attempt -lt 8) {Start-Sleep -Seconds ([Math]::Min(30,3*$attempt))}
            }
          }
          if (!$downloaded) {throw 'Unable to download and hash-verify pinned v0.4 base after retries'}
          $z='C:\Program Files\7-Zip\7z.exe'
          & $z t FHG-base.zip | Out-Null
          if ($LASTEXITCODE -ne 0) {throw 'Base ZIP invalid'}
          New-Item -ItemType Directory -Force stage | Out-Null
          & $z x FHG-base.zip -ostage -y | Out-Null
          if ($LASTEXITCODE -ne 0) {throw 'Base ZIP extraction failed'}
          foreach($f in @('stage/FHG.exe','stage/FHGGuard.exe','stage/Firefox/firefox.exe','stage/Hiddify/Hiddify.exe')){
            if (!(Test-Path $f)) {throw "Missing expected FHG base file: $f"}
          }
          Copy-Item publish-launcher/FHG.exe stage/FHG.exe -Force
          Copy-Item build-guard/Release/FHGGuard.exe stage/FHGGuard.exe -Force
          Copy-Item publish-accounts/FHGAccountManager.exe stage/FHGAccountManager.exe -Force
          Write-Host 'PASS: old faulty guard and launcher replaced by rebuilt non-admin-readable WFP guard.'
      - name: Replace original UI assets with source-patched Hiddify
        shell: pwsh
        run: |
          $release='vendor/build/windows/x64/runner/Release'
          Remove-Item stage/Hiddify/data -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item stage/Hiddify/Hiddify.exe -Force -ErrorAction SilentlyContinue
          Remove-Item stage/Hiddify/hiddify_portable_data -Recurse -Force -ErrorAction SilentlyContinue
          Get-ChildItem $release -Force | ForEach-Object {
            Copy-Item -LiteralPath $_.FullName -Destination stage/Hiddify -Recurse -Force
          }
          foreach($f in @('stage/Hiddify/FHGProxy.exe','stage/Hiddify/flutter_windows.dll','stage/Hiddify/data/flutter_assets')){
            if (!(Test-Path $f)) {throw "Patched GUI incomplete: $f"}
          }
          Copy-Item packaging/patch-hiddify-proxy-only.py stage/FHG-SOURCE-PATCH.py
          Copy-Item packaging/rebrand-hiddify.py stage/FHG-REBRAND-SOURCE.py
          Copy-Item packaging/FHG-Diagnose.ps1 stage/FHG-Diagnose.ps1
          Copy-Item packaging/FHG-Diagnose.cmd stage/FHG-Diagnose.cmd
          Copy-Item docs/FIRST-RUN-LOCAL-SETUP.md stage/FIRST-RUN-LOCAL-SETUP.md
          Copy-Item FHG-HIDDIFY-SOURCE.patch stage/FHG-HIDDIFY-SOURCE.patch
          Copy-Item docs/HIDDIFY-PROXY-ONLY.md stage/README-PROXY-ONLY.md
          Copy-Item docs/RELEASE-v0.5.2-rc.1.md stage/RELEASE-NOTES.md
          Copy-Item vendor/LICENSE.md stage/HIDDIFY-LICENSE.md
          New-Item -ItemType Directory -Path stage/licenses -Force | Out-Null
          Copy-Item vendor/LICENSE.md stage/licenses/Hiddify-LICENSE.md -Force
          Copy-Item docs/FIRST-RUN-LOCAL-SETUP.md stage/licenses/FHG-SECURITY-AND-SETUP.md -Force
          $sig=Get-AuthenticodeSignature stage/Hiddify/FHGProxy.exe
          Write-Host 'Patched Hiddify signature status:' $sig.Status
          Write-Host 'Patched FHG Proxy SHA256:' (Get-FileHash stage/Hiddify/FHGProxy.exe -Algorithm SHA256).Hash
          if (Test-Path stage/Hiddify/Hiddify.exe) {throw 'Old conflicting Hiddify.exe remains in bundle'}
          ./native/app/resources/check-icon-signature.ps1 -Controller stage/Hiddify/FHGProxy.exe -Guard stage/FHGGuard.exe
      - name: Windows native core bootstrap smoke test (not a subscription connectivity test)
        shell: pwsh
        run: |
          $exe=(Resolve-Path stage/Hiddify/FHGProxy.exe).Path
          $work=(Resolve-Path stage/Hiddify).Path
          $proc=$null
          try {
            $proc=Start-Process -FilePath $exe -WorkingDirectory $work -PassThru
            $ready=$false
            for($tick=0; $tick -lt 24; $tick++){
              Start-Sleep -Seconds 1
              if ($proc.HasExited) {throw "FHGProxy.exe exited before its native core bound control port 27178: $($proc.ExitCode)"}
              $listener=Get-NetTCPConnection -LocalPort 27178 -State Listen -ErrorAction SilentlyContinue | Where-Object {$_.OwningProcess -eq $proc.Id -and $_.LocalAddress -eq '127.0.0.1'}
              if ($listener){$ready=$true;break}
            }
            if(!$ready){throw 'FHG core startup smoke test failed: no 127.0.0.1:27178 owned by FHGProxy.exe'}
            Write-Host 'PASS: FHG Proxy GUI started and its core owns the dedicated control port 27178.'
          } finally {
            if ($proc) {
              try { Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue } catch {}
            }
          }
      - name: Slim isolated FHG Firefox safely for AI websites
        shell: pwsh
        run: |
          # The native-core smoke test produces temporary data and logs.
          # Never redistribute these database/log files in a fresh install.
          Remove-Item stage/Hiddify/fhg_proxy_portable_data -Recurse -Force -ErrorAction SilentlyContinue
          Copy-Item firefox/distribution/policies.json stage/Firefox/distribution/policies.json -Force
          ./packaging/trim-firefox-safe.ps1 -FirefoxDirectory stage/Firefox
          ./packaging/bundle-totp-addon.ps1 -FirefoxDirectory stage/Firefox
          if (!(Test-Path stage/Firefox/distribution/fhg-authenticator.xpi) -or !(Test-Path stage/Firefox/distribution/fhg-authenticator.xpi.sha256)) {throw 'Signed offline Authenticator missing'}
          Write-Host 'PASS: locally bundled and SHA-checked Authenticator signed extension present.'
          $p=Get-Content 'stage/Firefox/distribution/policies.json' -Raw | ConvertFrom-Json
          if ($p.policies.Proxy.SOCKSProxy -ne '127.0.0.1:12345' -or
              !$p.policies.Proxy.Locked -or !$p.policies.Proxy.UseProxyForDNS -or
              !$p.policies.DisableAppUpdate) {throw 'Firefox proxy or update lock weakened'}
          if ($p.policies.NewTabPage -ne $true -or
              !$p.policies.DisableFirefoxAccounts) {throw 'AI-oriented Firefox defaults missing'}
          if ($p.policies.OverrideFirstRunPage -ne '' -or
              $p.policies.SkipTermsOfUse -ne $true -or
              $p.policies.RequestedLocales[0] -ne 'en-US' -or
              $p.policies.Bookmarks[0].URL -ne 'https://chatgpt.com/' -or
              $p.policies.DisplayBookmarksToolbar -ne 'always') {throw 'FHG English/Firefox onboarding/ChatGPT bookmark policy missing'}
          if ($p.policies.ExtensionSettings.'authenticator@mymindstorm'.default_area -ne 'navbar' -or
              $p.policies.ExtensionSettings.'authenticator@mymindstorm'.installation_mode -ne 'force_installed' -or
              $p.policies.Homepage.URL -ne 'https://chatgpt.com/' -or
              $p.policies.FirefoxHome.TopSites -ne $true) {throw 'Automatic Authenticator or ChatGPT Top Sites policy missing'}
          Write-Host 'PASS: Firefox first run, ChatGPT Home/Top Sites and signed Authenticator policy verified.'
          Write-Host 'PASS: AI focused Firefox compact UI and safe trim applied to complete Windows bundle.'
      - name: Reject legacy WPF FHG (12334) or obsolete CLI from installer
        shell: pwsh
        run: |
          foreach($required in @('stage/FHG.exe','stage/FHGGuard.exe','stage/FHGAccountManager.exe','stage/Firefox/firefox.exe','stage/Hiddify/FHGProxy.exe')){
            if (!(Test-Path $required)) {throw "Incomplete official-Hiddify FHG package: $required"}
          }
          $launcherHash=(Get-FileHash publish-launcher/FHG.exe -Algorithm SHA256).Hash
          $stagedLauncherHash=(Get-FileHash stage/FHG.exe -Algorithm SHA256).Hash
          if ($launcherHash -ne $stagedLauncherHash) {throw 'Staged FHG.exe is NOT the corrected minimal launcher. Refusing legacy WPF executable.'}
          $nativeGui=(Resolve-Path vendor/build/windows/x64/runner/Release/FHGProxy.exe).Path
          $patchedHash=(Get-FileHash $nativeGui -Algorithm SHA256).Hash
          $stagedHash=(Get-FileHash stage/Hiddify/FHGProxy.exe -Algorithm SHA256).Hash
          if ($patchedHash -ne $stagedHash) {throw 'Staged FHGProxy.exe is NOT the source-patched native Hiddify GUI.'}
          foreach($forbidden in @('stage/Core/HiddifyCli.exe','stage/FHG.UI.dll','stage/FHG-experimental-win-x64.zip')){
            if (Test-Path $forbidden) {throw "Legacy controller artifact in release payload: $forbidden"}
          }
          $title=(Get-Item stage/FHG.exe).VersionInfo.ProductName
          if ($title -notmatch 'FHG') {throw "Unexpected launcher publisher metadata: $title"}
          Write-Host 'PASS: official patched Hiddify GUI, isolated browser, correct launcher; no old custom 12334 dashboard.'
      - name: Build and verify clean self-contained Windows FHG Setup EXE
        shell: pwsh
        env:
          FHG_SIGNING_PFX_BASE64: ${{ secrets.FHG_SIGNING_PFX_BASE64 }}
          FHG_SIGNING_PFX_PASSWORD: ${{ secrets.FHG_SIGNING_PFX_PASSWORD }}
        run: |
          choco install innosetup --no-progress -y --limit-output
          if ($LASTEXITCODE -ne 0) {throw 'Inno Setup installation failed'}
          $iscc='C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (!(Test-Path $iscc)) {throw "Inno Setup compiler missing: $iscc"}
          & $iscc packaging/FHG-Setup.iss
          if ($LASTEXITCODE -ne 0) {throw 'FHG installer compilation failed'}
          $exe='installer-output/FHG-Setup-Windows-x64-0.6.0-preview.exe'
          if (!(Test-Path $exe)) {throw 'Standalone Setup.exe missing'}
          if ($env:GITHUB_EVENT_NAME -eq 'push' -and $env:GITHUB_REF -eq 'refs/heads/main') {
            ./packaging/sign-publisher.ps1 -Controller $exe -Guard stage/FHGGuard.exe
          }
          $bytes=(Get-Item $exe).Length
          if ($bytes -lt 50000000) {throw "Unexpectedly small Setup.exe: $bytes"}
          $hash=(Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText(($exe+'.sha256'),($hash+'  FHG-Setup-Windows-x64-0.6.0-preview.exe'+[Environment]::NewLine),[Text.Encoding]::ASCII)
          Write-Host "PASS: self-contained FHG Setup EXE: $bytes bytes SHA256 $hash"
          # Use a destination without spaces and wait for the Setup child
          # process to finish; an immediate & exe return alone is not proof
          # that Inno Setup completed extraction.
          $dest=Join-Path $env:RUNNER_TEMP 'FHGInstallerSmoke'
          $log=Join-Path $env:RUNNER_TEMP 'FHGInstallerSmoke.log'
          $installer = Start-Process -FilePath (Resolve-Path $exe).Path -PassThru -Wait -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',("/DIR="+$dest),("/LOG="+$log))
          if ($installer.ExitCode -ne 0) {
            if (Test-Path $log) {Get-Content $log -Tail 90}
            throw "Installer silent test failed: exit code $($installer.ExitCode)"
          }
          foreach($p in @('FHG.exe','FHGGuard.exe','FHGAccountManager.exe','Hiddify/FHGProxy.exe','Firefox/firefox.exe','licenses/Hiddify-LICENSE.md')){
            if (!(Test-Path (Join-Path $dest $p))) {
              if (Test-Path $log) {Get-Content $log -Tail 90}
              throw "Missing installed file: $p in $dest"
            }
          }
          if ((Get-ChildItem $dest -Recurse -File | Where-Object { $_.Extension -in '.py','.pyc','.pdb' } | Measure-Object).Count -gt 0){
            throw 'Developer source files leaked into installed app tree'
          }
          Write-Host 'PASS: silent installer into custom folder, 3 native EXEs and no developer source files.'
      - uses: actions/upload-artifact@v4
        with:
          name: FHG-Setup-EXE-ENGINEERING-PREVIEW
          path: |
            installer-output/FHG-Setup-Windows-x64-0.6.0-preview.exe
            installer-output/FHG-Setup-Windows-x64-0.6.0-preview.exe.sha256
          retention-days: 7
          if-no-files-found: error
      - name: Publish downloadable unsigned FHG test installer on GitHub Releases
        if: github.event_name == 'push' && github.ref == 'refs/heads/feature-exe-installer-dpapi-accounts-20261105'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag='v0.6.0-test.3'
          $setup='installer-output/FHG-Setup-Windows-x64-0.6.0-preview.exe'
          $hash="$setup.sha256"
          if (!(Test-Path $setup) -or !(Test-Path $hash) -or !(Test-Path FHG-HIDDIFY-SOURCE.patch)) {
            throw 'Complete test release files not found; cannot publish.'
          }
          $actual=(Get-FileHash $setup -Algorithm SHA256).Hash.ToLowerInvariant()
          $expected=((Get-Content $hash -Raw).Trim() -split '\s+')[0]
          if ($actual -ne $expected) {throw "Installer digest mismatch: $actual"}
          $existing=gh release view $tag --repo $env:GITHUB_REPOSITORY --json tagName 2>$null
          if ($LASTEXITCODE -eq 0) {
            throw "Test release $tag already exists; refusing to overwrite a tested binary."
          }
          gh release create $tag $setup $hash FHG-HIDDIFY-SOURCE.patch --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title 'FHG v0.6.0-test.3 — Secure Account Handoff (UNSIGNED TEST BUILD)' --notes-file docs/RELEASE-v0.6.0-test.3.md --prerelease --latest=false
          if ($LASTEXITCODE -ne 0) {throw 'GitHub Release upload failed'}
          Write-Host "PASS: test release published, SHA256 $actual"
      - name: Package complete offline test artifact
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          $z='C:\Program Files\7-Zip\7z.exe'
          $filename='FHG-ProxyOnly-12345-Windows-x64-v0.5.2-rc.1.zip'
          $target=Join-Path (Get-Location) $filename
          Push-Location stage
          try {
            & $z a -tzip -mx=5 $target '*' | Out-Null
            if ($LASTEXITCODE -ne 0) {throw 'ZIP pack failed'}
          } finally {Pop-Location}
          & $z t $target | Out-Null
          if ($LASTEXITCODE -ne 0) {throw 'ZIP validation failed'}
          $hash=(Get-FileHash $target -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText((Join-Path (Get-Location) ($filename + '.sha256')),($hash+'  '+$filename+[Environment]::NewLine),[Text.Encoding]::ASCII)
          Write-Host "PASS: ZIP integrity. SHA256 $hash"
          # Solid LZMA2 gives a materially smaller *distribution* without
          # deleting Firefox engine files or changing on-disk signed binaries.
          $compact='FHG-ProxyOnly-12345-Windows-x64-v0.5.2-rc.1-Compact.7z'
          $cTarget=Join-Path (Get-Location) $compact
          Push-Location stage
          try {
            & $z a -t7z -mx=9 -ms=on -mmt=on $cTarget '*' | Out-Null
            if ($LASTEXITCODE -ne 0) {throw 'Compact 7z build failed'}
          } finally {Pop-Location}
          & $z t $cTarget | Out-Null
          if ($LASTEXITCODE -ne 0) {throw 'Compact 7z integrity test failed'}
          $cHash=(Get-FileHash $cTarget -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText((Join-Path (Get-Location) ($compact+'.sha256')),($cHash+'  '+$compact+[Environment]::NewLine),[Text.Encoding]::ASCII)
          $regular=(Get-Item $target).Length
          $smaller=(Get-Item $cTarget).Length
          $saved=[Math]::Round((1-$smaller/$regular)*100,1)
          Write-Host "PASS: standard ZIP $regular bytes; compact 7z $smaller bytes; reduction $saved percent; SHA256 $cHash"
          if ($smaller -ge $regular) {throw 'Compact distribution did not achieve any size reduction'}
      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main'
        with:
          name: FHG-ProxyOnly-12345-Windows-x64-rc2
          path: |
            FHG-ProxyOnly-12345-Windows-x64-v0.5.2-rc.1.zip
            FHG-ProxyOnly-12345-Windows-x64-v0.5.2-rc.1.zip.sha256
            FHG-ProxyOnly-12345-Windows-x64-v0.5.2-rc.1-Compact.7z
            FHG-ProxyOnly-12345-Windows-x64-v0.5.2-rc.1-Compact.7z.sha256
            FHG-HIDDIFY-SOURCE.patch
          if-no-files-found: error
      - name: Publish signed and device-approved FHG Setup EXE prerelease
        if: github.ref == 'refs/heads/main' && vars.FHG_RELEASE_APPROVED == 'yes' && vars.FHG_E2E_APPROVED == 'yes' && vars.FHG_LICENSE_APPROVED == 'yes'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          foreach($native in @('stage/FHG.exe','stage/FHGGuard.exe','stage/Hiddify/FHGProxy.exe','stage/FHGAccountManager.exe','installer-output/FHG-Setup-Windows-x64-0.6.0-preview.exe')) {
            if ((Get-AuthenticodeSignature $native).Status -ne 'Valid') {
              throw "Unsigned FHG native executable: $native. A public release requires valid publisher Authenticode."
            }
          }
          $tag='v0.6.0-rc.1'
          $setup='installer-output/FHG-Setup-Windows-x64-0.6.0-preview.exe'
          if (!(Test-Path $setup) -or !(Test-Path "$setup.sha256")) {throw 'Signed installer files missing'}
          gh release view $tag --repo $env:GITHUB_REPOSITORY 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            throw "Release $tag already exists; refusing to replace public installer artifacts."
          }
          gh release create $tag $setup "$setup.sha256" FHG-HIDDIFY-SOURCE.patch --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title 'FHG Browser v0.6.0-rc.1 — Signed Windows Setup and Encrypted Accounts' --notes-file docs/RELEASE-v0.6.0-rc.1.md --prerelease
          if ($LASTEXITCODE -ne 0) {throw 'Signed FHG installer release upload failed'}
