plugins {
    id 'com.android.application'
}

android {
    namespace 'com.fhg.android'
    compileSdk 37

    defaultConfig {
        applicationId 'com.fhg.android'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '0.2.0-embedded-vpn-beta'
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        jniLibs {
            useLegacyPackaging true
        }
    }
}

dependencies {
    implementation 'org.mozilla.geckoview:geckoview:159.0.20261022150525'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20250517'
    // GPLv3 libbox: pinned official release, downloaded and hash-checked by CI.
    implementation files('libs/libbox.aar')
}
