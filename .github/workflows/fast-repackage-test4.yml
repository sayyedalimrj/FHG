name: FHG test.4 baseline-preserving Windows installer
on:
  push:
    branches:
      - feature-exe-installer-dpapi-accounts-20261105
    paths:
      - .github/workflows/fast-repackage-test4.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  repackage:
    if: github.repository == 'sayyedalimrj/FHG'
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Test existing DPAPI vault and code generation with dummy credentials
        shell: pwsh
        run: |
          dotnet run --project native/account-vault-tests/FHG.VaultTests.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw 'DPAPI/TOTP tests failed' }
      - name: Build only improved FHG Account Manager executable
        shell: pwsh
        run: |
          python native/app/resources/generate_icon.py native/original-ui/Assets/FHG.ico
          if ($LASTEXITCODE -ne 0) { throw 'Icon generation failed' }
          dotnet publish native/account-manager/FHGAccountManager.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o publish-accounts
          if ($LASTEXITCODE -ne 0 -or !(Test-Path 'publish-accounts/FHGAccountManager.exe')) { throw 'Account Manager EXE build failed' }
      - name: Download and validate published test.2 baseline
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download v0.6.0-test.2 --repo $env:GITHUB_REPOSITORY --pattern 'FHG-Setup-Windows-x64-0.6.0-preview.exe' --dir "$env:RUNNER_TEMP"
          if ($LASTEXITCODE -ne 0) { throw 'Could not fetch prior baseline' }
          $base = Join-Path $env:RUNNER_TEMP 'FHG-Setup-Windows-x64-0.6.0-preview.exe'
          $actual = (Get-FileHash -LiteralPath $base -Algorithm SHA256).Hash.ToLowerInvariant()
          $expected = '18619f8acf89f56c4af9cc2e5682254277db7d7f54f102f024ba901b2daea16d'
          if ($actual -ne $expected) { throw "Baseline release is not verified: $actual" }
          gh release download v0.6.0-test.2 --repo $env:GITHUB_REPOSITORY --pattern 'FHG-HIDDIFY-SOURCE.patch' --dir .
          if ($LASTEXITCODE -ne 0 -or !(Test-Path 'FHG-HIDDIFY-SOURCE.patch')) { throw 'Required GPL source patch missing' }
          Write-Host "PASS: verified released installer SHA-256 $actual"
      - name: Install verified baseline into isolated staging directory
        shell: pwsh
        run: |
          $base = Join-Path $env:RUNNER_TEMP 'FHG-Setup-Windows-x64-0.6.0-preview.exe'
          $install = Join-Path $env:RUNNER_TEMP 'FHGBaselineStage'
          New-Item -ItemType Directory -Path $install -Force | Out-Null
          $baselineResult = Start-Process -FilePath $base -Wait -PassThru -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-',("/DIR="+$install))
          if ($baselineResult.ExitCode -ne 0) { throw "Baseline installer failed: $($baselineResult.ExitCode)" }
          foreach ($required in @('FHG.exe','FHGGuard.exe','FHGAccountManager.exe','Firefox/firefox.exe','Hiddify/FHGProxy.exe','licenses/Hiddify-LICENSE.md')) {
            if (!(Test-Path (Join-Path $install $required))) { throw "Missing baseline file: $required" }
          }
          New-Item -ItemType Directory -Path stage -Force | Out-Null
          Copy-Item -Path (Join-Path $install '*') -Destination stage -Recurse -Force
          foreach ($immutable in @('FHG.exe','FHGGuard.exe','Firefox/firefox.exe','Hiddify/FHGProxy.exe')) {
            $src=(Get-FileHash -LiteralPath (Join-Path $install $immutable) -Algorithm SHA256).Hash
            $dst=(Get-FileHash -LiteralPath (Join-Path 'stage' $immutable) -Algorithm SHA256).Hash
            if ($src -ne $dst) { throw "Baseline binary modified unexpectedly: $immutable" }
          }
          Copy-Item publish-accounts/FHGAccountManager.exe stage/FHGAccountManager.exe -Force
          $actual = (Get-FileHash stage/FHGAccountManager.exe -Algorithm SHA256).Hash
          $expected = (Get-FileHash publish-accounts/FHGAccountManager.exe -Algorithm SHA256).Hash
          if ($actual -ne $expected) { throw 'Improved FHG Account Manager was not installed into stage' }
          Write-Host 'PASS: reused unchanged FHG Proxy, Firefox, Guard and launcher'
      - name: Rebuild complete Windows installer and run installation smoke test
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup install failed' }
          $iscc = 'C:/Program Files (x86)/Inno Setup 6/ISCC.exe'
          if (!(Test-Path $iscc)) { throw 'Inno Setup compiler not installed' }
          & $iscc 'packaging/FHG-Setup.iss'
          if ($LASTEXITCODE -ne 0) { throw 'Complete Inno installer build failed' }
          $out='installer-output/FHG-Setup-Windows-x64-0.6.0-preview.exe'
          if (!(Test-Path $out)) { throw 'Installer is missing' }
          $destination=Join-Path $env:RUNNER_TEMP 'FHGTest4Installed'
          $setupResult = Start-Process -FilePath (Resolve-Path $out).Path -Wait -PassThru -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-',("/DIR="+$destination))
          if ($setupResult.ExitCode -ne 0) { throw "Smoke-test installation failed: $($setupResult.ExitCode)" }
          foreach ($required in @('FHG.exe','FHGGuard.exe','FHGAccountManager.exe','Firefox/firefox.exe','Hiddify/FHGProxy.exe','licenses/Hiddify-LICENSE.md')) {
            if (!(Test-Path (Join-Path $destination $required))) { throw "Missing installed file: $required" }
          }
          $expected=(Get-FileHash stage/FHGAccountManager.exe -Algorithm SHA256).Hash
          $installed=(Get-FileHash (Join-Path $destination 'FHGAccountManager.exe') -Algorithm SHA256).Hash
          if ($expected -ne $installed) { throw 'Installed Account Manager is not the improved build' }
          foreach ($immutable in @('FHG.exe','FHGGuard.exe','Firefox/firefox.exe','Hiddify/FHGProxy.exe')) {
            $src=(Get-FileHash (Join-Path stage $immutable) -Algorithm SHA256).Hash
            $dst=(Get-FileHash (Join-Path $destination $immutable) -Algorithm SHA256).Hash
            if ($src -ne $dst) { throw "Protected baseline changed in installation: $immutable" }
          }
          if ((Get-ChildItem $destination -Recurse -File | Where-Object { $_.Extension -in '.py','.pyc','.pdb' } | Measure-Object).Count -gt 0) {
            throw 'Developer sources leaked into installed package'
          }
          $hash=(Get-FileHash $out -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText(($out+'.sha256'), ($hash+'  FHG-Setup-Windows-x64-0.6.0-preview.exe'+[Environment]::NewLine), [Text.Encoding]::ASCII)
          Write-Host "PASS: test.4 rebuilt from verified baseline and smoke-tested; SHA256 $hash"
      - uses: actions/upload-artifact@v4
        with:
          name: FHG-Setup-Windows-x64-v0.6.0-test.4
          path: |
            installer-output/FHG-Setup-Windows-x64-0.6.0-preview.exe
            installer-output/FHG-Setup-Windows-x64-0.6.0-preview.exe.sha256
          if-no-files-found: error
          retention-days: 7
      - name: Publish unsigned test.4 prerelease after successful smoke test
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view v0.6.0-test.4 --repo $env:GITHUB_REPOSITORY --json tagName 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) { throw 'Release test.4 already exists; refusing to overwrite' }
          gh release create v0.6.0-test.4 installer-output/FHG-Setup-Windows-x64-0.6.0-preview.exe installer-output/FHG-Setup-Windows-x64-0.6.0-preview.exe.sha256 FHG-HIDDIFY-SOURCE.patch --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title 'FHG v0.6.0-test.4 — Account Management Repair (UNSIGNED)' --notes-file docs/RELEASE-v0.6.0-test.4.md --prerelease --latest=false
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed' }
          Write-Host 'PASS: separate unsigned test.4 preview published without changing Hiddify baseline'
