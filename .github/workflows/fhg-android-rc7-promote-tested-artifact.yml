name: FHG RC7 promote exact successfully installed APK
on:
  push:
    branches:
      - android-rc7-install-verified-20261107
    paths:
      - '.github/workflows/fhg-android-rc7-promote-tested-artifact.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  promote-tested-artifact:
    if: github.repository == 'sayyedalimrj/FHG'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify signed APK and both Android install jobs passed
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_SOURCE_SHA=05ae55aaf933f38929508ca042b9b9124685cfe0
          ACTUAL_SHA="$(gh api repos/sayyedalimrj/FHG/actions/runs/42344111740 --jq '.head_sha')"
          test "$ACTUAL_SHA" = "$EXPECTED_SOURCE_SHA"
          gh api 'repos/sayyedalimrj/FHG/actions/runs/42344111740/jobs?per_page=100' \
            --jq '.jobs[] | [.name,.conclusion] | @tsv' > /tmp/fhg-rc7-gates.tsv
          cat /tmp/fhg-rc7-gates.tsv
          grep -Fx "$(printf 'build\tsuccess')" /tmp/fhg-rc7-gates.tsv
          grep -Fx "$(printf 'install (35)\tsuccess')" /tmp/fhg-rc7-gates.tsv
          grep -Fx "$(printf 'install (36)\tsuccess')" /tmp/fhg-rc7-gates.tsv
          echo "PASS: source SHA and all 3 installation/build gates independently verified"
      - uses: actions/download-artifact@v4
        with:
          name: FHG-RC7-SIGNED-APK
          repository: sayyedalimrj/FHG
          run-id: 42344111740
          github-token: ${{ github.token }}
          path: dist
      - name: Publish exactly the tested signed APK (no rebuild, no resign)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c dist/FHG-Secure-Android-1.0.0-rc7-ARM64.apk.sha256
          test -s dist/BUILD_INFO.txt
          test -s dist/FHG-Secure-Android-1.0.0-rc7-ARM64.apk
          TAG=android-v1.0.0-rc.7
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Refusing to overwrite an existing signed APK release"
            exit 1
          fi
          gh release create "$TAG" \
            dist/FHG-Secure-Android-1.0.0-rc7-ARM64.apk \
            dist/FHG-Secure-Android-1.0.0-rc7-ARM64.apk.sha256 \
            dist/BUILD_INFO.txt \
            --target 05ae55aaf933f38929508ca042b9b9124685cfe0 \
            --title 'FHG Secure Android RC7 — local-file install tested on Android 15 + 16' \
            --notes-file android/V1-AUDIT.md \
            --prerelease --latest=false
          echo 'PASS: immutable RC7 prerelease published from the identical tested APK'
