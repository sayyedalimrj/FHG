name: FHG v1.0.0 final direct Firefox and distinct icons
on:
  push:
    branches: [release-v1-distinct-shortcut-icons-20261106]
    paths:
      - .github/workflows/release-fhg-v1-final.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    if: github.repository == 'sayyedalimrj/FHG'
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Run synthetic account, proxy and login tests
        shell: pwsh
        run: |
          foreach($project in @(
            'native/account-vault-tests/FHG.VaultTests.csproj',
            'native/proxy-workspace-tests/FHG.ProxyWorkspace.Tests.csproj',
            'native/auto-login-tests/FHG.Login.Tests.csproj'
          )) {
            dotnet run --project $project -c Release
            if ($LASTEXITCODE -ne 0) { throw "Regression tests failed: $project" }
          }
          $launcher=Get-Content native/original-ui/Program.cs -Raw
          $helper=Get-Content native/auto-login/Program.cs -Raw
          $store=Get-Content native/auto-login/FirefoxPasswordStore.cs -Raw
          $bridge=Get-Content native/auto-login/FirefoxDriverBridge.cs -Raw
          $vault=Get-Content native/account-manager/AccountVault.cs -Raw
          $progress=Get-Content native/auto-login/LoginProgress.cs -Raw
          $installer=Get-Content packaging/FHG-Setup.iss -Raw
          if (!$launcher.Contains('return OpenOneNativeFirefox(activeId, passwordStored)') -or
              !$launcher.Contains('PrepareFirefoxSavedPassword(activeId)') -or
              !$launcher.Contains('if (IsProfileInUse(ProfileDir))') -or
              $launcher.Contains('RunAutomaticChatGptLogin') -or
              !$helper.Contains('OfflinePasswordImport(args[1])') -or
              $helper.Contains('browser.GoTo("https://chatgpt.com/login")') -or
              $helper.Contains('SubmitOnce(') -or
              !$helper.Contains('headless: true') -or
              !$store.Contains('Services.logins.addLoginAsync(login)') -or
              !$store.Contains('Services.logins.modifyLoginAsync(existing, login)') -or
              !$store.Contains('https://auth.openai.com') -or
              !$store.Contains('https://chatgpt.com') -or
              !$vault.Contains('firefox-password-imported.v1') -or
              !$progress.Contains('PASSWORD_SAVED') -or
              !$progress.Contains('PASSWORD_IMPORT_FAILED') -or
              !$bridge.Contains('bool headless = false') -or
              !$installer.Contains('Compression=lzma2/ultra64') -or
              !$installer.Contains('LZMADictionarySize=262144') -or
              !$installer.Contains('#define FhgVersion "1.0.0"')) {
            throw 'Regression: native Firefox, no website automation, NSS auto-save, no duplicate tabs required'
          }
          if (!$helper.Contains('temporaryProfile, headless: true') -or
              !$launcher.Contains('for (int i = 0; i < 60 && IsProfileInUse(ProfileDir); i++)')) {
            throw 'Release must test real headless NSS import and profile-lock shutdown'
          }
          $iconScript=Get-Content native/app/resources/generate_shortcut_icons.py -Raw
          $shortcuts=Get-Content native/original-ui/ShortcutManager.cs -Raw
          $managerProject=Get-Content native/workspace-ui/FHGWorkspace.csproj -Raw
          if (!$iconScript.Contains('FHGFirefox.ico') -or
              !$iconScript.Contains('FHGProxy.ico') -or
              !$iconScript.Contains('FHGAccounts.ico') -or
              !$shortcuts.Contains('Path.Combine(appRoot, "Firefox", "firefox.exe")') -or
              !$shortcuts.Contains('FirefoxArguments(selectedAccountId!)') -or
              !$shortcuts.Contains('old bundled FHG installation') -or
              !$shortcuts.Contains('AccountVault.AccountFirefoxDir(id)') -or
              !$managerProject.Contains('FHGAccounts.ico') -or
              !$installer.Contains('Filename: "{app}\Firefox\firefox.exe"') -or
              !$installer.Contains('function FirefoxProfileArgs') -or
              !$installer.Contains('Raw: AnsiString;') -or
              $installer.Contains('raise Exception.Create') -or
              !$installer.Contains('Check: HasConfiguredAccount') -or
              !$installer.Contains('FHGProxy.ico') -or
              !$installer.Contains('FHGAccounts.ico') -or
              !$launcher.Contains('ShortcutManager.Sync(Root, AccountPaths.ActiveId)') -or
              !$installer.Contains('#define FhgVersion "1.0.0"')) {
            throw 'FHG v1 regression: direct native Firefox target, profile-specific shortcut and 3 distinct icon identities are mandatory'
          }
          Write-Host 'PASS: v1.0.0 direct Firefox shortcut, active private profile, distinct Proxy and Accounts icons'
          Write-Host 'PASS: no ChatGPT website automation, direct encrypted password save, one native profile browser'
      - name: Build guarded launcher, simplified account manager and Firefox login
        shell: pwsh
        run: |
          python native/app/resources/generate_icon.py native/original-ui/Assets/FHG.ico
          if ($LASTEXITCODE -ne 0) {throw 'App icon generation failed'}
          python native/app/resources/generate_shortcut_icons.py native/original-ui/Assets
          if ($LASTEXITCODE -ne 0) {throw 'Three distinct Windows icon generation failed'}
          foreach($asset in @('FHGFirefox.ico','FHGAccounts.ico','FHGProxy.ico')) {
            $path=Join-Path native/original-ui/Assets $asset
            if (!(Test-Path $path)) {throw "Missing icon: $asset"}
          }
          $iconHashes=@('FHGFirefox.ico','FHGAccounts.ico','FHGProxy.ico') |
            ForEach-Object { (Get-FileHash (Join-Path native/original-ui/Assets $_)).Hash }
          if (@($iconHashes|Select-Object -Unique).Count -ne 3) {
            throw 'Account, proxy and Firefox icon binary resources are not distinct'
          }
          foreach($item in @(
            @('native/original-ui/FHG.csproj','publish-launcher'),
            @('native/workspace-ui/FHGWorkspace.csproj','publish-accounts'),
            @('native/auto-login/FHGLogin.csproj','publish-login')
          )){
            dotnet publish $item[0] -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o $item[1]
            if ($LASTEXITCODE -ne 0) {throw "Windows compile failed: $($item[0])"}
          }
          foreach ($path in @('publish-launcher/FHG.exe','publish-accounts/FHGAccountManager.exe','publish-login/FHGLogin.exe')) {
            if (!(Test-Path $path)) {throw "Missing compiled component: $path"}
          }
      - name: Pin and unpack the previously verified Firefox/Hiddify/Guard baseline
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download v0.6.0 --repo $env:GITHUB_REPOSITORY --pattern FHG-Setup-Windows-x64-0.6.0.exe --dir $env:RUNNER_TEMP
          if ($LASTEXITCODE -ne 0) {throw 'Could not download existing complete baseline'}
          $base=Join-Path $env:RUNNER_TEMP 'FHG-Setup-Windows-x64-0.6.0.exe'
          $sha=(Get-FileHash $base -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($sha -ne 'd71e876a0bf8fae949b95c042bc3703c17bc2a0f0597e369d713c4201e675395') {
            throw 'Pinned previous installer SHA256 mismatch'
          }
          $path=Join-Path $env:RUNNER_TEMP 'FHGPreviousRelease'
          $run=Start-Process -FilePath $base -Wait -PassThru -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-',("/DIR="+$path))
          if ($run.ExitCode -ne 0) {throw 'Baseline extraction failed'}
          New-Item -ItemType Directory stage -Force | Out-Null
          Copy-Item (Join-Path $path '*') stage -Recurse -Force
          Copy-Item publish-launcher/FHG.exe stage/FHG.exe -Force
          Copy-Item publish-accounts/FHGAccountManager.exe stage/FHGAccountManager.exe -Force
          Copy-Item publish-login/FHGLogin.exe stage/FHGLogin.exe -Force
          New-Item -ItemType Directory stage/Assets -Force | Out-Null
          Copy-Item native/original-ui/Assets/FHGFirefox.ico stage/Assets/FHGFirefox.ico -Force
          Copy-Item native/original-ui/Assets/FHGAccounts.ico stage/Assets/FHGAccounts.ico -Force
          Copy-Item native/original-ui/Assets/FHGProxy.ico stage/Assets/FHGProxy.ico -Force
          foreach($immutable in @(
            'FHGGuard.exe','Hiddify/FHGProxy.exe','Firefox/firefox.exe',
            'Firefox/distribution/fhg-authenticator.xpi','WebDriver/geckodriver.exe'
          )) {
            $src=Join-Path $path $immutable
            $dst=Join-Path stage $immutable
            if (!(Test-Path $src) -or !(Test-Path $dst) -or
                (Get-FileHash $src -Algorithm SHA256).Hash -ne (Get-FileHash $dst -Algorithm SHA256).Hash) {
                throw "Protected existing Firefox/Hiddify/WFP component unexpectedly changed: $immutable"
            }
          }
          if (Test-Path stage/Firefox/distribution/fhg-auto-authenticator.xpi) {
            throw 'Incorrect custom Authenticator extension must not be shipped'
          }
          Write-Host 'PASS: existing Firefox, original signed Authenticator, Hiddify and Guard preserved'
      - name: Validate actual Windows desktop shortcut targets and icons for account changes
        shell: pwsh
        run: |
          dotnet run --project native/shortcut-tests/FHG.ShortcutTests.csproj -c Release -- (Resolve-Path stage).Path
          if ($LASTEXITCODE -ne 0) {throw 'v1 direct Firefox COM shortcut or icon regression'}
          Write-Host 'PASS: desktop links target private Firefox, proxy and accounts use unique icons, profiles update'

      - name: Download pinned Mozilla-signed timezone addon 0.5.0
        shell: pwsh
        run: |
          $destination=Join-Path (Resolve-Path 'stage/Firefox/distribution').Path 'fhg-timezone.xpi'
          Invoke-WebRequest -Uri 'https://addons.mozilla.org/firefox/downloads/latest/spoof-timezone/latest.xpi' -OutFile $destination -MaximumRedirection 12
          if (!(Test-Path $destination)) {throw 'Timezone extension unavailable'}
          $digest=(Get-FileHash $destination -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($digest -ne '542422365981287388c243ab60c4ac3b62df6713a8c00761fdff9fc06f70ba6f') {throw 'Timezone addon hash differs from verified signed release'}
          Add-Type -AssemblyName System.IO.Compression
          $zip=[System.IO.Compression.ZipFile]::OpenRead($destination)
          try {
            $entry=$zip.GetEntry('manifest.json')
            if ($null -eq $entry) {throw 'Mozilla XPI has no manifest'}
            $reader=[System.IO.StreamReader]::new($entry.Open())
            try {$manifest=$reader.ReadToEnd()|ConvertFrom-Json}
            finally {$reader.Dispose()}
            if ($manifest.version -ne '0.5.0' -or
                $manifest.browser_specific_settings.gecko.id -ne '{55f61747-c3d3-4425-97f9-dfc19a0be23c}') {
              throw 'Wrong timezone addon signed identity/version'
            }
            if (@($zip.Entries|Where-Object FullName -like 'META-INF/*').Count -lt 2) {
              throw 'XPI signature records absent'
            }
          } finally {$zip.Dispose()}
          [IO.File]::WriteAllText(($destination+'.sha256'),
            ($digest+'  fhg-timezone.xpi'+[Environment]::NewLine),[Text.Encoding]::ASCII)
          New-Item -ItemType Directory stage/licenses -Force | Out-Null
          Invoke-WebRequest -Uri 'https://raw.githubusercontent.com/joue-quroi/spoof-timezone/master/v3/LICENSE' -OutFile 'stage/licenses/Spoof-Timezone-MPL-2.0.txt'
          if (!(Test-Path 'stage/licenses/Spoof-Timezone-MPL-2.0.txt')) {throw 'MPL license absent'}
          Write-Host 'PASS: hash-pinned existing Mozilla-signed Spoof Timezone 0.5.0 archived with MPL license'
      - name: Force-install the original signed XPI in the temporary CI Firefox
        shell: pwsh
        run: |
          $xpi=Join-Path (Get-Location) 'stage/Firefox/distribution/fhg-authenticator.xpi'
          $policyFile='stage/Firefox/distribution/policies.json'
          $policy=Get-Content $policyFile -Raw | ConvertFrom-Json
          $original=$policy.policies.ExtensionSettings.'authenticator@mymindstorm'
          if ($null -eq $original -or $original.installation_mode -ne 'force_installed') {
            throw 'Original signed extension policy missing'
          }
          $original.install_url=([System.Uri]::new($xpi)).AbsoluteUri
          $tz=(Resolve-Path 'stage/Firefox/distribution/fhg-timezone.xpi').Path
          $policy.policies.ExtensionSettings | Add-Member -NotePropertyName '{55f61747-c3d3-4425-97f9-dfc19a0be23c}' -NotePropertyValue @{
            installation_mode='force_installed'
            install_url=([System.Uri]::new($tz)).AbsoluteUri
          } -Force
          $policy | ConvertTo-Json -Depth 25 | Set-Content $policyFile -Encoding utf8
      - name: Verify real Firefox imports synthetic TOTP into original Authenticator
        shell: pwsh
        run: |
          Push-Location stage
          try {
            & ./FHGLogin.exe --self-test-driver
            if ($LASTEXITCODE -ne 0) {
              throw "Original Authenticator must import once and recognize same synthetic account on next pass: exit $LASTEXITCODE"
            }
          } finally { Pop-Location }
          Write-Host 'PASS: signed original Firefox Authenticator and pinned Berlin timezone verified'
          dotnet run --project native/login-input-tests/FHG.InputTests.csproj -c Release -- (Resolve-Path stage).Path
          if ($LASTEXITCODE -ne 0) {throw 'Exact synthetic login character and CET/CEST test failed'}
      - name: Build and smoke-test complete one-click Windows installer
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          if ($LASTEXITCODE -ne 0) {throw 'Inno Setup unavailable'}
          & 'C:/Program Files (x86)/Inno Setup 6/ISCC.exe' packaging/FHG-Setup.iss
          if ($LASTEXITCODE -ne 0) {throw 'Installer compilation failed'}
          $installer='installer-output/FHG-Setup-Windows-x64-1.0.0.exe'
          if (!(Test-Path $installer)) {throw 'Missing setup EXE'}
          $test=Join-Path $env:RUNNER_TEMP 'FHGFinalVersionOneInstalled'
          $result=Start-Process -FilePath (Resolve-Path $installer).Path -PassThru -Wait -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-',("/DIR="+$test))
          if ($result.ExitCode -ne 0) {throw "Setup failed: $($result.ExitCode)"}
          foreach($item in @(
            'FHG.exe','FHGAccountManager.exe','FHGLogin.exe','FHGGuard.exe',
            'Hiddify/FHGProxy.exe','Firefox/firefox.exe','Firefox/distribution/fhg-authenticator.xpi',
            'Firefox/distribution/fhg-timezone.xpi','Firefox/distribution/fhg-timezone.xpi.sha256',
            'WebDriver/geckodriver.exe',
            'Assets/FHGFirefox.ico','Assets/FHGAccounts.ico','Assets/FHGProxy.ico'
          )) {
            if (!(Test-Path (Join-Path $test $item))) {throw "Missing installed file $item"}
            if ((Get-FileHash (Join-Path $test $item)).Hash -ne
                (Get-FileHash (Join-Path stage $item)).Hash) {
              throw "Corrupted installed component: $item"
            }
          }
          if ((Get-ChildItem $test -Recurse -File | Where-Object Extension -in '.py','.pyc','.pdb' | Measure-Object).Count -ne 0) {
            throw 'Developer scripts or symbols leaked into installation'
          }
          $sha=(Get-FileHash $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText(($installer+'.sha256'),($sha+'  FHG-Setup-Windows-x64-1.0.0.exe'+[Environment]::NewLine),[Text.Encoding]::ASCII)
          Write-Host "PASS: complete installed final package; SHA256 $sha"
      - uses: actions/upload-artifact@v4
        with:
          name: FHG-Setup-Windows-x64-v1.0.0
          path: |
            installer-output/FHG-Setup-Windows-x64-1.0.0.exe
            installer-output/FHG-Setup-Windows-x64-1.0.0.exe.sha256
          if-no-files-found: error
          retention-days: 7
      - name: Publish FHG v1.0.0 after complete Windows tests
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download v0.6.0 --repo $env:GITHUB_REPOSITORY --pattern FHG-HIDDIFY-SOURCE.patch --dir .
          if ($LASTEXITCODE -ne 0) { throw 'GPL-compliant Hiddify source patch missing' }
          gh release view v1.0.0 --repo $env:GITHUB_REPOSITORY --json tagName 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {throw 'Existing tag v1.0.0 cannot be overwritten'}
          $ok=$false
          for($i=1;$i -le 4;$i++) {
            gh release create v1.0.0 installer-output/FHG-Setup-Windows-x64-1.0.0.exe installer-output/FHG-Setup-Windows-x64-1.0.0.exe.sha256 FHG-HIDDIFY-SOURCE.patch --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title 'FHG Browser v1.0.0 Final — Direct Firefox, distinct icons and saved logins (UNSIGNED)' --notes-file docs/RELEASE-v1.0.0.md --latest
            if ($LASTEXITCODE -eq 0) {$ok=$true;break}
            Start-Sleep -Seconds (5*$i)
          }
          if (!$ok) {throw 'GitHub Release service unavailable; verified installer remains in Actions artifact'}
