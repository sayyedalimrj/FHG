name: Windows FHG controller x64
on:
  push:
    paths:
      - "native/app/**"
      - "native/guard/**"
      - "firefox/distribution/**"
      - ".github/workflows/windows-controller.yml"
      - "packaging/**"
  pull_request:
    paths:
      - "native/app/**"
      - "native/guard/**"
      - "firefox/distribution/**"
      - ".github/workflows/windows-controller.yml"
      - "packaging/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Generate original FHG multi-resolution icon
        run: python native/app/resources/generate_icon.py
      - name: Generate original FHG application icon
        shell: pwsh
        run: ./native/app/assets/generate-icon.ps1
      - name: Configure controller
        run: cmake -S native/app -B build-app -G "Visual Studio 17 2022" -A x64
      - name: Compile controller
        run: cmake --build build-app --config Release --parallel
      - name: Configure guard
        run: cmake -S native/guard -B build-guard -G "Visual Studio 17 2022" -A x64
      - name: Compile guard
        run: cmake --build build-guard --config Release --parallel
      - name: Publisher signing (only with valid repository code-signing certificate)
        shell: pwsh
        env:
          FHG_SIGNING_PFX_BASE64: ${{ secrets.FHG_SIGNING_PFX_BASE64 }}
          FHG_SIGNING_PFX_PASSWORD: ${{ secrets.FHG_SIGNING_PFX_PASSWORD }}
        run: |
          ./packaging/sign-publisher.ps1 -Controller build-app/Release/FHG.exe -Guard build-guard/Release/FHGGuard.exe
      - name: Verify embedded FHG icon and Authenticode statuses
        shell: pwsh
        run: |
          ./native/app/resources/check-icon-signature.ps1 -Controller build-app/Release/FHG.exe -Guard build-guard/Release/FHGGuard.exe
      - name: Audit app icon and Authenticode status
        shell: pwsh
        run: |
          $exe = "build-app/Release/FHG.exe"
          $bytes = [IO.File]::ReadAllBytes((Resolve-Path $exe).Path)
          $text = [Text.Encoding]::Unicode.GetString($bytes)
          if (!$text.Contains("FHG Secure Browser Experimental")) { throw "Missing embedded version resource" }
          $s = Get-AuthenticodeSignature $exe
          Write-Host "FHG Authenticode:" $s.Status
          if ($s.Status -eq 'Valid') { Write-Host "Certificate signer:" $s.SignerCertificate.Subject }
          else { Write-Warning "FHG is UNSIGNED. A trusted Code Signing certificate is required for public signing." }
          Get-FileHash $exe -Algorithm SHA256 | Format-List
          Get-FileHash "build-guard/Release/FHGGuard.exe" -Algorithm SHA256 | Format-List
      - name: Package native components
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item build-app/Release/FHG.exe dist/FHG.exe
          Copy-Item build-guard/Release/FHGGuard.exe dist/FHGGuard.exe
          Copy-Item firefox/distribution/policies.json dist/policies.json
      - name: Assemble offline experimental browser
        shell: pwsh
        run: |
          ./packaging/build-offline.ps1 -Controller build-app/Release/FHG.exe -Guard build-guard/Release/FHGGuard.exe
      - name: Upload offline experimental browser
        uses: actions/upload-artifact@v4
        with:
          name: FHG-experimental-OFFLINE-browser-windows-x64
          path: FHG-experimental-win-x64.zip
          if-no-files-found: error
      - name: Upload experimental components
        uses: actions/upload-artifact@v4
        with:
          name: FHG-experimental-controller-x64
          path: dist/*
          if-no-files-found: error
