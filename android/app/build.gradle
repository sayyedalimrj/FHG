plugins {
    id 'com.android.application'
}

android {
    namespace 'com.fhg.android'
    compileSdk 37

    defaultConfig {
        applicationId 'com.fhg.android.secure.hiddify'
        minSdk 26
        targetSdk 35
        versionCode 110
        versionName '1.0.0-hiddify-bridge.1'

        // GeckoView browser retained; libbox no longer bundled or used.
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    testOptions {
        unitTests.all {
            testLogging {
                events 'failed', 'passed', 'skipped'
                exceptionFormat 'full'
                showStackTraces true
                showCauses true
            }
        }
    }

    packaging {
        jniLibs {
            useLegacyPackaging true // compressed 16-KB-compatible ARM64 libs; sideload-size optimized
        }
    }
}

dependencies {
    implementation 'org.mozilla.geckoview:geckoview:159.0.20261022150525'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20250517'
}
