plugins {
    id 'com.android.application'
}

android {
    namespace 'com.fhg.android'
    compileSdk 37

    defaultConfig {
        applicationId 'com.fhg.android.repair'
        minSdk 26
        targetSdk 35
        versionCode 5
        versionName '0.2.3-repair-beta'

        // One architecture only: Android phones with 64-bit ARM CPUs.
        // Strips x86, x86_64 and 32-bit ARM native engines (libbox and
        // GeckoView) from the delivered APK; no VPN/browser code removed.
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    testOptions {
        unitTests.all {
            testLogging {
                events 'failed', 'passed', 'skipped'
                exceptionFormat 'full'
                showStackTraces true
                showCauses true
            }
        }
    }

    packaging {
        jniLibs {
            useLegacyPackaging true
        }
    }
}

dependencies {
    implementation 'org.mozilla.geckoview:geckoview:159.0.20261022150525'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20250517'
    // GPLv3 libbox: pinned official release, downloaded and hash-checked by CI.
    implementation files('libs/libbox.aar')
    // Apache 2.0: parse common Clash YAML subscriptions without code execution.
    implementation 'org.yaml:snakeyaml:2.5'
}
