name: FHG Android integrated sing-box VPN + GeckoView 0.2 beta

on:
  push:
    branches:
      - android-embedded-singbox-20261106
    paths:
      - 'android/**'
      - '.github/workflows/fhg-android-embedded-vpn.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Confirm runner Android SDK and install API 37
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "Using runner SDK: $SDK_ROOT"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -maxdepth 3 -name sdkmanager -type f | sort -V | tail -1)"
          fi
          if [ ! -x "$SDKMANAGER" ]; then echo "Android sdkmanager unavailable" >&2; exit 1; fi
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platforms;android-37.0" "build-tools;36.0.0"
          # Android 17 platforms are distributed with a minor version.
          # Avoid AGP's fresh-platform resolver inconsistency.
          if [ -d "$SDK_ROOT/platforms/android-37.0" ] && [ ! -e "$SDK_ROOT/platforms/android-37" ]; then
            ln -s android-37.0 "$SDK_ROOT/platforms/android-37"
          fi
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Verify hard VPN gate, Keystore, official login domain, no fake VPN
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'AndroidKeyStore' android/app/src/main/java/com/fhg/android/AccountStore.java
          grep -q 'AES/GCM/NoPadding' android/app/src/main/java/com/fhg/android/AccountStore.java
          grep -q 'TRANSPORT_VPN' android/app/src/main/java/com/fhg/android/NetworkGate.java
          grep -q 'EmbeddedVpnService.isEstablished' android/app/src/main/java/com/fhg/android/NetworkGate.java
          grep -q 'class EmbeddedVpnService extends VpnService' android/app/src/main/java/com/fhg/android/EmbeddedVpnService.java
          grep -q 'io.nekohasekai.libbox.CommandServer' android/app/src/main/java/com/fhg/android/EmbeddedVpnService.java
          grep -q 'startOrReloadService' android/app/src/main/java/com/fhg/android/EmbeddedVpnService.java
          grep -q 'protect(numeric(args' android/app/src/main/java/com/fhg/android/EmbeddedVpnService.java
          grep -q 'setAction(EmbeddedVpnService.ACTION_CONNECT)' android/app/src/main/java/com/fhg/android/MainActivity.java
          grep -q 'android.permission.BIND_VPN_SERVICE' android/app/src/main/AndroidManifest.xml
          grep -q 'No direct' android/app/src/main/java/com/fhg/android/VpnConfig.java
          grep -q 'session.close()' android/app/src/main/java/com/fhg/android/BrowserActivity.java
          grep -q 'contextId(account.id)' android/app/src/main/java/com/fhg/android/BrowserActivity.java
          grep -q 'setAutocompleteStorageDelegate' android/app/src/main/java/com/fhg/android/BrowserActivity.java
          grep -q 'request.confirm' android/app/src/main/java/com/fhg/android/BrowserActivity.java
          if grep -q 'setPackage("app.hiddify.com")' android/app/src/main/java/com/fhg/android/MainActivity.java; then
            echo 'External Hiddify dependency accidentally returned' >&2
            exit 1
          fi
          grep -q 'usesCleartextTraffic="false"' android/app/src/main/AndroidManifest.xml
          test ! -e android/app/src/main/java/com/fhg/android/PLACEHOLDER_VPN.java
          echo 'PASS: Android Keystore, GeckoView, embedded real libbox bridge, protected sockets and fail-closed browser gate'
      - name: Download and verify pinned GPLv3 sing-box libbox Android AAR
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p android/app/libs
          curl --fail --location --retry 4 --retry-delay 5 --max-time 350 \
            'https://github.com/singbox-android/libbox/releases/download/1.14.4/libbox.aar' \
            -o android/app/libs/libbox.aar
          echo 'd2685924a657705beda44e94c6dc499e781df1ad20d65474e3591ec2f8b96465  android/app/libs/libbox.aar' | sha256sum -c -
          unzip -t android/app/libs/libbox.aar | tail -2
          unzip -l android/app/libs/libbox.aar | grep -E 'classes.jar|libgo.so' | head
          echo 'PASS: pinned sing-box native VPN engine verified, no binary committed'
      - name: Compile and test real integrated VPN + GeckoView APK
        working-directory: android
        run: |
          gradle --no-daemon --stacktrace :app:testDebugUnitTest :app:assembleDebug
      - name: Verify Android APK content and integrity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/FHG-Android-0.2.0-embedded-vpn-beta.apk
          cd dist
          sha256sum FHG-Android-0.2.0-embedded-vpn-beta.apk > FHG-Android-0.2.0-embedded-vpn-beta.apk.sha256
          unzip -t FHG-Android-0.2.0-embedded-vpn-beta.apk | tail -2
          SIZE=$(stat -c%s FHG-Android-0.2.0-embedded-vpn-beta.apk)
          if [ "$SIZE" -lt 1000000 ]; then echo 'APK suspiciously small' >&2; exit 1; fi
          echo "PASS: Android GeckoView debug APK built, validated, SHA-256 written; bytes=$SIZE"
      - uses: actions/upload-artifact@v4
        with:
          name: FHG-Android-0.2.0-embedded-vpn-beta-APK
          path: dist/FHG-Android-0.2.0-embedded-vpn-beta.apk*
          if-no-files-found: error
      - name: Publish testable Android beta APK only after all gates
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="android-v0.2.0-embedded-beta.1"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Existing Android beta release tag is immutable; refusing overwrite" >&2
            exit 1
          fi
          gh release create "$TAG"             dist/FHG-Android-0.2.0-embedded-vpn-beta.apk             dist/FHG-Android-0.2.0-embedded-vpn-beta.apk.sha256             --target "$GITHUB_SHA"             --title 'FHG Android 0.2.0 Beta — Integrated sing-box VPN + GeckoView'             --notes-file android/EMBEDDED-VPN.md             --prerelease --latest=false
